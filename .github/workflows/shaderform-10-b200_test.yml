name: gpt-oss trtllm

on:
  workflow_call:
    inputs:
      exp-name:
        required: true
        type: string
        default: 'gptoss_trtllm'
      isl:
        required: true
        type: string
        default: '1024'
      osl:
        required: true
        type: string
        default: '1024'
      max-model-len:
        required: true
        type: string
        default: '2304'
      random-range-ratio:
        required: true
        type: string
        default: '0.8'

      use_b200:
        type: boolean
        required: true
      runner_label:
        type: string 
        required: true
jobs:
  bmk-b200-trt:
    if: ${{ inputs.use_b200 }}
    uses: ./.github/workflows/benchmark-tmpl.yml
    secrets: inherit
    with:
      exp-name: ${{ inputs.exp-name }}
      isl: ${{ inputs.isl }}
      osl: ${{ inputs.osl }}
      max-model-len: ${{ inputs.max-model-len }}
      random-range-ratio: ${{ inputs.random-range-ratio }}
      runner: b200-trt
      image: 'nvcr.io#nvidia/tensorrt-llm/release:1.1.0rc2.post2'
      model: 'openai/gpt-oss-120b'
      tp-list: '[1, 8]'
      framework: 'trt'
      precision: 'fp4'
      runs-on: ${{ inputs.runner_label }}