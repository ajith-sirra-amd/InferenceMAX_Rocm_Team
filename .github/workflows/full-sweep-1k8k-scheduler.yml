name: Full Sweep Scheduler - 1k8k

concurrency:
  group: benchmark-lock-1k8k
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  mega-run:
    uses: ./.github/workflows/full-sweep-tmpl.yml
    secrets: inherit
    with:
      run_1k1k: false
      run_8k1k: false
      run_1k8k: true
      use_h100: true
      use_h200: true
      use_b200: true
      use_mi300x: true
      use_mi325x: true
      use_mi355x: true
      use_gb200: true
