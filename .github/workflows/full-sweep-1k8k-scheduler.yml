name: Full Sweep Scheduler - 1k8k

on:
  workflow_dispatch:
    inputs:
      run_dsr1:
        required: true
        type: boolean
        default: False
      run_gptoss:
        required: true
        type: boolean
        default: False

jobs:
  mega-run:
    uses: ./.github/workflows/full-sweep-tmpl.yml
    secrets: inherit
    with:
      run_1k1k: false
      run_8k1k: false
      run_1k8k: true
      use_h100: false
      use_h200: false
      use_b200: false
      use_mi300x: false
      use_mi325x: false
      use_mi355x: true
      use_gb200: false
