name: LLaMA 70B Full Sweep Template

on:
  workflow_call:
    inputs:
      run_1k1k:
        type: boolean
        required: true
      run_8k1k:
        type: boolean
        required: true
      run_1k8k:
        type: boolean
        required: true

      use_mi300x:
        type: boolean
        required: true
      use_mi325x:
        type: boolean
        required: true
      use_mi355x:
        type: boolean
        required: true

      precision:
        type: string
        required: false
        default: 'fp8'

jobs:
  llama70b-1k1k:
    if: ${{ inputs.run_1k1k }}
    uses: ./.github/workflows/70b-tmpl.yml
    secrets: inherit
    with:
      exp-name: '70b_1k1k'
      isl: 1024
      osl: 1024
      max-model-len: 2048
      random-range-ratio: 0.8
      precision: ${{ inputs.precision }}
      use_mi300x: ${{ inputs.use_mi300x }}
      use_mi325x: ${{ inputs.use_mi325x }}
      use_mi355x: ${{ inputs.use_mi355x }}

  collect-llama70b-1k1k-results:
    needs: llama70b-1k1k
    if: ${{ inputs.run_1k1k && always() }}
    uses: ./.github/workflows/collect-results.yml
    secrets: inherit
    with:
      exp-name: '70b_1k1k'

  llama70b-8k1k:
    if: ${{ inputs.run_8k1k }}
    uses: ./.github/workflows/70b-tmpl.yml
    secrets: inherit
    with:
      exp-name: '70b_8k1k'
      isl: 8192
      osl: 1024
      max-model-len: 9216
      random-range-ratio: 0.8
      precision: ${{ inputs.precision }}
      use_mi300x: ${{ inputs.use_mi300x }}
      use_mi325x: ${{ inputs.use_mi325x }}
      use_mi355x: ${{ inputs.use_mi355x }}

  collect-llama70b-8k1k-results:
    needs: llama70b-8k1k
    if: ${{ inputs.run_8k1k && always() }}
    uses: ./.github/workflows/collect-results.yml
    secrets: inherit
    with:
      exp-name: '70b_8k1k'

  llama70b-1k8k:
    if: ${{ inputs.run_1k8k }}
    uses: ./.github/workflows/70b-tmpl.yml
    secrets: inherit
    with:
      exp-name: '70b_1k8k'
      isl: 1024
      osl: 8192
      max-model-len: 9216
      random-range-ratio: 0.8
      precision: ${{ inputs.precision }}
      use_mi300x: ${{ inputs.use_mi300x }}
      use_mi325x: ${{ inputs.use_mi325x }}
      use_mi355x: ${{ inputs.use_mi355x }}

  collect-llama70b-1k8k-results:
    needs: llama70b-1k8k
    if: ${{ inputs.run_1k8k && always() }}
    uses: ./.github/workflows/collect-results.yml
    secrets: inherit
    with:
      exp-name: '70b_1k8k'
