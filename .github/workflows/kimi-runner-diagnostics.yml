name: Kimi runner diagnostics
run-name: Kimi runner diagnostics - exit 137
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: [self-hosted, "cluster:mi355x-amds-2", "nodes:1"]
    timeout-minutes: 5
    steps:
      - name: Read Docker lifecycle and host memory evidence
        shell: bash
        run: |
          date -u
          hostname
          docker events --since "2026-10-27T07:14:00Z" --until "2026-10-27T07:24:00Z" --filter type=container --filter container=bmk-server --format '{{.Time}} {{.Action}} signal={{index .Actor.Attributes "signal"}} exitCode={{index .Actor.Attributes "exitCode"}} name={{index .Actor.Attributes "name"}}'
          docker ps --format '{{.Names}} {{.Status}}'
          docker info --format 'Memory={{.MemTotal}} CgroupDriver={{.CgroupDriver}} CgroupVersion={{.CgroupVersion}}'
          cat /proc/meminfo
          cat /proc/self/cgroup
          for task_path in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
            if [ -r "$task_path" ]; then
              echo "$task_path"
              cat "$task_path"
            fi
          done
          journalctl -k --since "2026-10-27 07:14:00 UTC" --until "2026-10-27 07:24:00 UTC" --no-pager 2>&1 | grep -Ei 'oom|killed process|out of memory|permission|journal files' || true
