name: Native FP8 stack diagnostic
on:
  push:
    branches: [checks/native-fp8-stack-20261102]
    paths:
      - .github/workflows/native-fp8-stack-diagnostic.yml
      - utils/atom_attention/bf16_blas_backend_repro.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-fp8-stack-diagnostic
  cancel-in-progress: false
env:
  OLD_IMAGE: vllm/vllm-openai-rocm:nightly-rocm100-edad8b03c5285a1c12e7e4f83c1af709b319a01b@sha256:009169c114af5b15e25eddc808afb3c1fc3f12c94e746472b16f39fcf39cd716
  NEW_IMAGE: vllm/vllm-openai-rocm:nightly-rocm100-e0d00e4b8eb0c89ec30921d0695cfdd409e9c211@sha256:b1374c3814b6e7706c49968ba17ca3b35484382f7b9fc7115dd3e66068d53f2f
  NATIVE_SHA: 492080779e9feea19308092b0aba0840e87c6115
jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
      - name: Validate diagnostic and workflow before GPU scheduling
        run: |
          uv venv --python 3.12
          uv pip install pyyaml
          .venv/bin/python - <<'PY'
          import ast, subprocess
          from pathlib import Path
          import yaml
          ast.parse(Path("utils/atom_attention/bf16_blas_backend_repro.py").read_text())
          workflow = yaml.safe_load(Path(".github/workflows/native-fp8-stack-diagnostic.yml").read_text())
          for job in workflow["jobs"].values():
              for step in job["steps"]:
                  if "run" in step:
                      subprocess.run(["bash", "-n"], input=step["run"], text=True, check=True)
          PY
          .venv/bin/python utils/atom_attention/bf16_blas_backend_repro.py --help
  gpu-diagnostic:
    needs: code-checks
    runs-on: [self-hosted, "cluster:mi355x-amds-2", "nodes:1"]
    timeout-minutes: 45
    steps:
      - name: Restore diagnostic directory ownership
        shell: bash
        run: |
          task_root="$GITHUB_WORKSPACE/.native-stack-diagnostics"
          if [ -d "$task_root" ]; then
            test ! -L "$task_root"
            workspace_real="$(realpath -e -- "$GITHUB_WORKSPACE")"
            test "$(realpath -e -- "$task_root")" = "$workspace_real/.native-stack-diagnostics"
            docker run --rm --network none --user 0:0 \
              --mount "type=bind,source=$task_root,target=/repair" \
              --entrypoint chown "$OLD_IMAGE" \
              --recursive --no-dereference -P -- "$(id -u):$(id -g)" /repair
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Reproduce logged BF16 shapes on current image
        id: old-bf16
        continue-on-error: true
        shell: bash
        run: |
          task_work="$GITHUB_WORKSPACE/.native-stack-diagnostics/${{ github.run_id }}/old"
          mkdir -p "$task_work"
          docker run --rm --init --network host --ipc=host --shm-size=8g \
            --device=/dev/kfd --device=/dev/dri \
            -v "$GITHUB_WORKSPACE":/repo:ro -v "$task_work":/work \
            -e PYTHONDONTWRITEBYTECODE=1 --entrypoint bash "$OLD_IMAGE" -lc \
            'uv venv --system-site-packages /work/.bootstrap && /work/.bootstrap/bin/python /repo/utils/atom_attention/bf16_blas_backend_repro.py --output /work/evidence'
      - name: Reproduce logged BF16 shapes on November 1 image
        id: new-bf16
        continue-on-error: true
        shell: bash
        run: |
          task_work="$GITHUB_WORKSPACE/.native-stack-diagnostics/${{ github.run_id }}/new"
          mkdir -p "$task_work"
          docker run --rm --init --network host --ipc=host --shm-size=8g \
            --device=/dev/kfd --device=/dev/dri \
            -v "$GITHUB_WORKSPACE":/repo:ro -v "$task_work":/work \
            -e PYTHONDONTWRITEBYTECODE=1 --entrypoint bash "$NEW_IMAGE" -lc \
            'uv venv --system-site-packages /work/.bootstrap && /work/.bootstrap/bin/python /repo/utils/atom_attention/bf16_blas_backend_repro.py --output /work/evidence'
      - name: Verify explicit hipBLAS backend on old image
        id: old-blas-candidate
        shell: bash
        run: |
          task_work="$GITHUB_WORKSPACE/.native-stack-diagnostics/${{ github.run_id }}/old-blas-candidate"
          mkdir -p "$task_work"
          docker run --rm --init --network host --ipc=host --shm-size=8g \
            --device=/dev/kfd --device=/dev/dri \
            -v "$GITHUB_WORKSPACE":/repo:ro -v "$task_work":/work \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e TORCH_BLAS_PREFER_HIPBLASLT=0 -e TORCH_BLAS_PREFER_CUBLASLT=0 \
            --entrypoint bash "$OLD_IMAGE" -lc \
            'uv venv --system-site-packages /work/.bootstrap && /work/.bootstrap/bin/python /repo/utils/atom_attention/bf16_blas_backend_repro.py --output /work/evidence --expect-blas cublas'
      - name: Verify explicit hipBLAS backend on new image
        id: new-blas-candidate
        shell: bash
        run: |
          task_work="$GITHUB_WORKSPACE/.native-stack-diagnostics/${{ github.run_id }}/new-blas-candidate"
          mkdir -p "$task_work"
          docker run --rm --init --network host --ipc=host --shm-size=8g \
            --device=/dev/kfd --device=/dev/dri \
            -v "$GITHUB_WORKSPACE":/repo:ro -v "$task_work":/work \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e TORCH_BLAS_PREFER_HIPBLASLT=0 -e TORCH_BLAS_PREFER_CUBLASLT=0 \
            --entrypoint bash "$NEW_IMAGE" -lc \
            'uv venv --system-site-packages /work/.bootstrap && /work/.bootstrap/bin/python /repo/utils/atom_attention/bf16_blas_backend_repro.py --output /work/evidence --expect-blas cublas'
      - name: Validate unchanged native FP8 PR kernels on November 1 image
        shell: bash
        run: |
          task_work="$GITHUB_WORKSPACE/.native-stack-diagnostics/${{ github.run_id }}/native"
          mkdir -p "$task_work"
          docker run --rm --init --network host --ipc=host --shm-size=8g \
            --device=/dev/kfd --device=/dev/dri \
            -v "$GITHUB_WORKSPACE":/repo:ro -v "$task_work":/work \
            -e PYTHONDONTWRITEBYTECODE=1 -e NATIVE_SHA \
            -e TORCH_BLAS_PREFER_HIPBLASLT=0 -e TORCH_BLAS_PREFER_CUBLASLT=0 \
            --entrypoint bash "$NEW_IMAGE" -lc \
            'uv venv --system-site-packages /work/.bootstrap && /work/.bootstrap/bin/python /repo/utils/atom_attention/native_vllm_gpu_validate.py --native-sha "$NATIVE_SHA"'
      - name: Restore evidence ownership
        if: always()
        shell: bash
        run: |
          task_root="$GITHUB_WORKSPACE/.native-stack-diagnostics"
          if [ -d "$task_root" ]; then
            test ! -L "$task_root"
            workspace_real="$(realpath -e -- "$GITHUB_WORKSPACE")"
            test "$(realpath -e -- "$task_root")" = "$workspace_real/.native-stack-diagnostics"
            docker run --rm --network none --user 0:0 \
              --mount "type=bind,source=$task_root,target=/repair" \
              --entrypoint chown "$OLD_IMAGE" \
              --recursive --no-dereference -P -- "$(id -u):$(id -g)" /repair
          fi
      - name: Upload runtime and numerical evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fp8-stack-diagnostic
          path: |
            .native-stack-diagnostics/${{ github.run_id }}/old/evidence/
            .native-stack-diagnostics/${{ github.run_id }}/new/evidence/
            .native-stack-diagnostics/${{ github.run_id }}/native/evidence/
            .native-stack-diagnostics/${{ github.run_id }}/old-blas-candidate/evidence/
            .native-stack-diagnostics/${{ github.run_id }}/new-blas-candidate/evidence/
          include-hidden-files: true
          if-no-files-found: error
