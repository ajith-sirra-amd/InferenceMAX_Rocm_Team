name: PR64288 cached-scale preparation comparison
on:
  push:
    branches: [checks/pr64288-focused-review-20261104]
    paths: [.github/workflows/pr64288-focused-review.yml]
permissions:
  contents: read
concurrency:
  group: pr64288-focused-review
  cancel-in-progress: false
env:
  IMAGE: vllm/vllm-openai-rocm:nightly-rocm100-e0d00e4b8eb0c89ec30921d0695cfdd409e9c211@sha256:b1374c3814b6e7706c49968ba17ca3b35484382f7b9fc7115dd3e66068d53f2f
  NATIVE_SHA: e2393d702a3736dffdfbfc7eb25abbabe484a1df
  BEFORE_SHA: 9857e13fe609befc603ad008f6e4ae2fe85726aa
jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
      - name: Check diagnostic syntax and workflow shell
        run: |
          uv venv --python 3.12
          uv pip install pyyaml
          .venv/bin/python - <<'PY'
          import ast, pathlib, subprocess, yaml
          ast.parse(pathlib.Path("utils/atom_attention/pr64288_cache_bound_scan.py").read_text())
          ast.parse(pathlib.Path("utils/atom_attention/pr64288_cache_bound_diagnostics.py").read_text())
          ast.parse(pathlib.Path("utils/atom_attention/pr64288_cache_preparation_comparison.py").read_text())
          workflow = yaml.safe_load(pathlib.Path(".github/workflows/pr64288-focused-review.yml").read_text())
          for job in workflow["jobs"].values():
              for step in job["steps"]:
                  if "run" in step:
                      subprocess.run(["bash", "-n"], input=step["run"], text=True, check=True)
          PY
      - name: Require exact candidate static checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 41819725072 --repo ajith-sirra-amd/vllm --exit-status --interval 30
          test "$(gh run view 41819725072 --repo ajith-sirra-amd/vllm --json conclusion --jq .conclusion)" = success
  gpu:
    needs: code-checks
    runs-on: [self-hosted, "cluster:mi355x-amds-2", "nodes:1"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          clean: false
      - name: Compare full preparation cost and validate large cache offsets
        shell: bash
        run: |
          task_work="$GITHUB_WORKSPACE/.native-review-diagnostics/41820076564"
          test -d "$task_work/vllm/.venv"
          docker run --rm --init --network host --ipc=host --shm-size=8g \
            --name "pr64288-review-$GITHUB_RUN_ID" \
            --device=/dev/kfd --device=/dev/dri \
            -v "$GITHUB_WORKSPACE":/repo:ro -v "$task_work":/work \
            -e PYTHONDONTWRITEBYTECODE=1 -e NATIVE_SHA -e BEFORE_SHA -e REVIEW_RUN_ID="$GITHUB_RUN_ID" \
            -e TORCH_BLAS_PREFER_HIPBLASLT=0 -e TORCH_BLAS_PREFER_CUBLASLT=0 \
            --entrypoint bash "$IMAGE" -lc '
              set -euo pipefail
              export REVIEW_EVIDENCE="/work/review-reruns/$REVIEW_RUN_ID"
              mkdir -p "$REVIEW_EVIDENCE"
              test "$(git -c safe.directory=/work/vllm -C /work/vllm rev-parse HEAD)" = "$NATIVE_SHA"
              git -c safe.directory=/work/vllm -C /work/vllm diff --exit-code -- vllm tests
              cp /work/evidence/native-validation.json "$REVIEW_EVIDENCE/prior-kernel-validation-run41820076564.json"
              export XDG_CACHE_HOME=/work/cache
              export HF_HOME=/work/cache/huggingface
              export TRITON_CACHE_DIR=/work/cache/triton
              export PYTHONPATH=/work/vllm
              export VLLM_PLUGINS=""
              export VLLM_ROCM_USE_AITER=1
              export VLLM_ROCM_USE_AITER_FLYDSL_FP8_PREFILL_ATTN=1
              cd /work/vllm
              .venv/bin/python /repo/utils/atom_attention/pr64288_cache_preparation_comparison.py "$REVIEW_EVIDENCE/cache-preparation-comparison.json" 2>&1 | tee "$REVIEW_EVIDENCE/cache-preparation-comparison.log"
              git -c safe.directory=/work/vllm diff --exit-code -- vllm tests
            '
      - name: Restore diagnostic output ownership
        if: always()
        shell: bash
        run: |
          task_work="$GITHUB_WORKSPACE/.native-review-diagnostics/41820076564"
          if [ -d "$task_work" ]; then
            test ! -L "$task_work"
            workspace_real="$(realpath -e -- "$GITHUB_WORKSPACE")"
            test "$(realpath -e -- "$task_work")" = "$workspace_real/.native-review-diagnostics/41820076564"
            docker run --rm --network none --user 0:0 \
              --mount "type=bind,source=$task_work,target=/repair" \
              --entrypoint chown "$IMAGE" \
              --recursive --no-dereference -P -- "$(id -u):$(id -g)" /repair
          fi
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr64288-focused-review
          path: .native-review-diagnostics/41820076564/review-reruns/${{ github.run_id }}/
          include-hidden-files: true
          if-no-files-found: error
