      EXP_NAME: 'gptoss_8k1k_acc'
      MODEL: 'openai/gpt-oss-120b'
      ISL: '8192'
      OSL: '1024'
      MAX_MODEL_LEN: '9216'
      RANDOM_RANGE_RATIO: '0.8'
      IMAGE: 'rocm/vllm-dev:open-mi355-08052025'
      FRAMEWORK: 'vllm'
