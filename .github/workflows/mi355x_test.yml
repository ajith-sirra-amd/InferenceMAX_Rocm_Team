name: gpt-oss trtllm

on:
  workflow_call:
    inputs:
      run_1k1k:
        type: boolean
        required: true
      run_8k1k:
        type: boolean
        required: true
      run_1k8k:
        type: boolean
        required: true
      use_mi355x:
        type: boolean
        required: true
      runner_label:
        type: string 
        required: true
jobs:
  gptoss-1k1k:
    if: ${{ inputs.run_1k1k && inputs.use_mi355x }}
    uses: ./.github/workflows/benchmark-tmpl_fix.yml
    secrets: inherit
    with:
      exp-name: 'gptoss_1k1k'
      isl: 1024
      osl: 1024
      max-model-len: 2048
      random-range-ratio: 0.8
      runner: ${{ inputs.runner_label }}
      image: 'rocm/7.0:rocm7.0_ubuntu_22.04_vllm_0.10.1_instinct_20250915'
      model: 'openai/gpt-oss-120b'
      tp-list: '[8, 1]'
      framework: 'trt'
      precision: 'fp4'
  collect-gptoss-1k1k-results:
    needs: gptoss-1k1k
    if: ${{ inputs.run_1k1k && (success() || failure()) }}
    uses: ./.github/workflows/collect-results.yml
    secrets: inherit
    with:
      exp-name: 'gptoss_1k1k'

  gptoss-8k1k:
    if: ${{ inputs.run_8k1k && inputs.use_mi355x }}
    uses: ./.github/workflows/benchmark-tmpl_fix.yml
    secrets: inherit
    with:
      exp-name: 'gptoss_8k1k'
      isl: '8292'
      osl: '1024'
      max-model-len: '9216'
      random-range-ratio: 0.8
      runner: ${{ inputs.runner_label }}
      image: 'rocm/7.0:rocm7.0_ubuntu_22.04_vllm_0.10.1_instinct_20250915'
      model: 'openai/gpt-oss-120b'
      tp-list: '[8, 1]'
      framework: 'trt'
      precision: 'fp4'
  collect-gptoss-8k1k-results:
    needs: gptoss-8k1k
    if: ${{ inputs.run_8k1k && (success() || failure()) }}
    uses: ./.github/workflows/collect-results.yml
    secrets: inherit
    with:
      exp-name: 'gptoss_8k1k'

  gptoss-1k8k:
    if: ${{ inputs.run_1k8k && inputs.use_mi355x }}
    uses: ./.github/workflows/benchmark-tmpl_fix.yml
    secrets: inherit
    with:
      exp-name: 'gptoss_1k8k'
      isl: '1024'
      osl: '8192'
      max-model-len: '9216'
      random-range-ratio: 0.8
      runner: ${{ inputs.runner_label }}
      image: 'rocm/7.0:rocm7.0_ubuntu_22.04_vllm_0.10.1_instinct_20250915'
      model: 'openai/gpt-oss-120b'
      tp-list: '[8, 1]'
      framework: 'trt'
      precision: 'fp4'
  collect-gptoss-1k8k-results:
    needs: gptoss-1k8k
    if: ${{ inputs.run_1k8k && (success() || failure()) }}
    uses: ./.github/workflows/collect-results.yml
    secrets: inherit
    with:
      exp-name: 'gptoss_1k8k'