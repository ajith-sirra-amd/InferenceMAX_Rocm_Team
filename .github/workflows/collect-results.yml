name: Template - Collect Results

on:
  workflow_call:
    inputs:
      exp-name:
        required: true
        type: string

jobs:
  collect-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: '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'
          fetch-depth: 0

      - name: Download JSON artifacts
        uses: actions/download-artifact@v5
        with:
          path: results/
          pattern: ${{ inputs.exp-name }}_*

      - name: Print summary
        run: python3 utils/summarize.py results/ ${{ inputs.exp-name }} >> $GITHUB_STEP_SUMMARY

      - name: Aggregate results
        run: python3 utils/collect_results.py results/ ${{ inputs.exp-name }}

      - name: Upload aggregated results
        uses: actions/upload-artifact@v4
        with:
          name: results_${{ inputs.exp-name }}
          path: agg_${{ inputs.exp-name }}.json
