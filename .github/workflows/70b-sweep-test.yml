name: Test - LLaMA 70B Sweep

on:
  workflow_dispatch:
    inputs:
      run_1k1k:
        type: boolean
        required: false
        default: false
      run_8k1k:
        type: boolean
        required: false
        default: false
      run_1k8k:
        type: boolean
        required: false
        default: false

      precision:
        type: choice
        required: false
        default: 'fp8'
        options:
          - 'fp4'
          - 'fp8'

      use_mi300x:
        type: boolean
        required: false
        default: false
      use_mi325x:
        type: boolean
        required: false
        default: false
      use_mi355x:
        type: boolean
        required: false
        default: false

      use_h100:
        type: boolean
        required: false
        default: false
      use_h200:
        type: boolean
        required: false
        default: false
      use_b200:
        type: boolean
        required: false
        default: false

jobs:
  llama70b-test-run:
    uses: ./.github/workflows/70b-sweep-tmpl.yml
    secrets: inherit
    with:
      run_1k1k: ${{ inputs.run_1k1k }}
      run_8k1k: ${{ inputs.run_8k1k }}
      run_1k8k: ${{ inputs.run_1k8k }}
      precision: ${{ inputs.precision }}
      use_mi300x: ${{ inputs.use_mi300x }}
      use_mi325x: ${{ inputs.use_mi325x }}
      use_mi355x: ${{ inputs.use_mi355x }}
      use_h100: ${{ inputs.use_h100 }}
      use_h200: ${{ inputs.use_h200 }}
      use_b200: ${{ inputs.use_b200 }}
