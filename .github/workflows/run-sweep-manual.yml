name: "SA Run Sweep Replica"
run-name: SA Run Sweep Replica - ${{ inputs.sweep-mode }}

concurrency:
    group: sweep-manual-${{ github.run_id }}
    cancel-in-progress: true

on:
    workflow_dispatch:
        inputs:
            base-ref:
                description: "Diff base ref for perf-changelog.yaml"
                required: false
                type: string
                default: "origin/main"
            head-ref:
                description: "Diff head ref for perf-changelog.yaml (blank = current commit)"
                required: false
                type: string
                default: ""
            sweep-mode:
                description: "Sweep mode (mirrors the mutually-exclusive PR sweep labels)"
                required: true
                type: choice
                default: "sweep-enabled"
                options:
                    - "none"
                    - "sweep-enabled"
                    - "full-sweep-enabled"
                    - "non-canary-full-sweep-enabled"
                    - "full-sweep-fail-fast"
                    - "full-sweep-fail-fast-no-canary"
            all-evals:
                description: "Label: all-evals"
                required: false
                type: choice
                default: "false"
                options: ["false", "true"]
            evals-only:
                description: "Label: evals-only"
                required: false
                type: choice
                default: "false"
                options: ["false", "true"]
            skip-queue:
                description: "Label: skip_queue"
                required: false
                type: choice
                default: "false"
                options: ["false", "true"]
            ci-patchwork:
                description: "Label: ci-patchwork"
                required: false
                type: choice
                default: "false"
                options: ["false", "true"]
            engine-patch:
                description: "Label: engine-patch"
                required: false
                type: choice
                default: "false"
                options: ["false", "true"]
            ci-patchwork-waived:
                description: "Label: ci-patchwork-waived"
                required: false
                type: choice
                default: "false"
                options: ["false", "true"]
            ci-checklist-complete:
                description: "Label: ci-checklist-complete"
                required: false
                type: choice
                default: "false"
                options: ["false", "true"]
            priority-criteria:
                description: >-
                    Comma-separated priority criteria. Valid values: multi-node, agentic,
                    eval-only, fp4, mtp, eagle, eagle3, sglang, vllm, dynamo-sglang,
                    dynamo-vllm, glm5, glm5.1, kimik2.5, kimik3, dsv4, minimaxm3, qwen3.5,
                    dsr1, checklist-complete, patchwork
                required: false
                type: string
                default: ""
            e2e-test-config:
                description: "Optional: also run e2e-tests.yml with this generate-cli-command. 'none' skips it."
                required: false
                type: choice
                default: "none"
                options:
                    - "none"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys dsv4-fp4-mi355x-atom-agentic-lmcache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys dsv4-fp4-mi355x-sglang-agentic-hicache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys minimaxm2.5-fp4-mi355x-vllm-agentic-lmcache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys minimaxm2.5-fp8-mi355x-vllm-agentic-lmcache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys kimik2.5-fp4-mi355x-vllm-agentic-lmcache"
                    - "test-config --config-files .github/configs/nvidia-master.yaml --config-keys kimik2.5-fp4-b200-vllm-agentic-lmcache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys qwen3.5-fp8-mi355x-sglang-agentic-hicache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys qwen3.5-fp4-mi355x-sglang-agentic-hicache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys glm5.1-fp4-mi355x-sglang-agentic-hicache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys glm5.1-fp8-mi355x-sglang-agentic-hicache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys glm5.1-fp8-mi300x-sglang-agentic"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys glm5.1-fp8-mi300x-sglang-agentic-hicache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys glm5.1-fp8-mi300x-sglang-agentic-smoke"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys qwen3.5-fp8-mi300x-sglang-agentic"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys qwen3.5-fp8-mi300x-sglang-agentic-hicache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys qwen3.5-fp8-mi300x-sglang-agentic-smoke"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys minimaxm2.5-fp8-mi300x-vllm-agentic-lmcache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys minimaxm2.5-fp8-mi325x-vllm-agentic-lmcache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys dsv4-fp4-mi355x-sglang-agentic-hicache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys dsv4-fp4-mi355x-vllm-agentic-lmcache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys dsv4-fp4-mi355x-sglang"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys kimik2.7-fp4-mi355x-vllm-agentic-lmcache"
                    - "test-config --config-files .github/configs/amd-master.yaml --config-keys minimaxm3-fp8-mi355x-vllm-agentic-lmcache"
                    - "test-config --config-files upstream/InferenceX/configs/amd-master.yaml --config-keys minimaxm3-fp4-mi355x-vllm-agentic"
                    - "test-config --config-files upstream/InferenceX/configs/amd-master.yaml --config-keys minimaxm3-fp4-mi355x-vllm-mtp-agentic"
            e2e-duration-override:
                description: "Override matrix.config.duration (seconds) for the e2e test job. Empty = use config value."
                required: false
                type: string
                default: ""

jobs:
    e2e-tests:
        if: ${{ inputs.e2e-test-config != 'none' }}
        uses: ./.github/workflows/e2e-tests.yml
        name: e2e /
        secrets: inherit
        with:
            generate-cli-command: ${{ inputs.e2e-test-config }}
            test-name: "SA Run Sweep Replica"
            ref: ${{ inputs.head-ref }}
            duration-override: ${{ inputs.e2e-duration-override }}

    setup:
        runs-on: ubuntu-latest
        outputs:
            search-space-config: ${{ steps.setup.outputs.search-space-config }}
        steps:
            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

            - id: setup
              env:
                  GH_TOKEN: ${{ github.token }}
                  TRIM_CONC: ${{ inputs.sweep-mode == 'sweep-enabled' }}
                  ALL_EVALS: ${{ inputs.all-evals }}
                  EVALS_ONLY: ${{ inputs.evals-only }}
                  SWEEP_MODE: ${{ inputs.sweep-mode }}
                  SKIP_QUEUE: ${{ inputs.skip-queue }}
                  CI_PATCHWORK: ${{ inputs.ci-patchwork }}
                  ENGINE_PATCH: ${{ inputs.engine-patch }}
                  CI_PATCHWORK_WAIVED: ${{ inputs.ci-patchwork-waived }}
                  CI_CHECKLIST_COMPLETE: ${{ inputs.ci-checklist-complete }}
                  PRIORITY_CRITERIA_INPUT: ${{ inputs.priority-criteria }}
              run: |

                  BASE_REF="${{ inputs.base-ref }}"
                  HEAD_REF="${{ inputs.head-ref }}"
                  if [ -z "$HEAD_REF" ]; then
                      HEAD_REF="${{ github.sha }}"
                  fi

                  PRIORITY_CRITERIA=$(jq -cn --arg csv "$PRIORITY_CRITERIA_INPUT" \
                      '[$csv | split(",") | .[] | gsub("^\\s+|\\s+$";"") | select(length > 0)]')

                  # Labels that downstream sweep/canary jobs and ci_priority.py key off of
                  LABELS_JSON=$(jq -cn \
                      --arg sweepMode "$SWEEP_MODE" \
                      --argjson skipQueue "$SKIP_QUEUE" \
                      --argjson ciPatchwork "$CI_PATCHWORK" \
                      --argjson enginePatch "$ENGINE_PATCH" \
                      --argjson ciPatchworkWaived "$CI_PATCHWORK_WAIVED" \
                      --argjson ciChecklistComplete "$CI_CHECKLIST_COMPLETE" \
                      '[$sweepMode] + (if $skipQueue then ["skip_queue"] else [] end)
                        + (if $ciPatchwork then ["ci-patchwork"] else [] end)
                        + (if $enginePatch then ["engine-patch"] else [] end)
                        + (if $ciPatchworkWaived then ["ci-patchwork-waived"] else [] end)
                        + (if $ciChecklistComplete then ["ci-checklist-complete"] else [] end)
                        | map(select(. != "none"))')

                  CMD=(
                      uv run --no-project --with pydantic --with pyyaml --python 3.12 \
                      "${GITHUB_WORKSPACE}/upstream/InferenceX/utils/process_changelog.py"
                      --changelog-file "${GITHUB_WORKSPACE}/upstream/InferenceX/perf-changelog.yaml"
                      --base-ref "$BASE_REF"
                      --head-ref "$HEAD_REF"
                  )
                  if [ "$TRIM_CONC" = "true" ]; then
                      CMD+=(--trim-conc)
                  fi
                  if [ "$ALL_EVALS" = "true" ]; then
                      CMD+=(--all-evals)
                  fi
                  if [ "$EVALS_ONLY" = "true" ]; then
                      CMD+=(--evals-only)
                  fi

                  CONFIG_JSON=$("${CMD[@]}")
                  CONFIG_JSON=$(printf '%s' "$CONFIG_JSON" | uv run --no-project --with pyyaml --python 3.12 \
                    "${GITHUB_WORKSPACE}/upstream/InferenceX/utils/ci_priority.py" \
                    --event-name "workflow_dispatch" \
                    --queue-namespace "${{ github.run_id }}:${{ github.run_attempt }}" \
                    --labels-json "$LABELS_JSON" \
                    --pr-number 0 \
                    --criteria-json "$PRIORITY_CRITERIA")

                  echo "search-space-config=$CONFIG_JSON" >> "$GITHUB_OUTPUT"

    canary-select:
        needs: setup
        if: ${{ inputs.sweep-mode == 'full-sweep-enabled' || inputs.sweep-mode == 'full-sweep-fail-fast' }}
        runs-on: ubuntu-latest
        outputs:
            canary-config: ${{ steps.pick.outputs.canary-config }}
            remaining-search-space-config: ${{ steps.pick.outputs.remaining-search-space-config }}
        steps:
            - id: pick
              env:
                  SEARCH_SPACE: ${{ needs.setup.outputs.search-space-config }}
              run: |
                  selection=$(jq -c '
                    def remove_one($needle):
                      if $needle == null then .
                      else
                        (index($needle)) as $idx
                        | if $idx == null then . else del(.[$idx]) end
                      end;

                    # Canary is a benchmark-only smoke test — exclude entries
                    # whose primary purpose is eval (run-eval == true) so the
                    # picked canary never runs an eval pass.
                    (((.single_node["1k1k"] // []) + (.single_node["8k1k"] // []))
                      | map(select(.["run-eval"] != true))) as $candidates
                    | (if ($candidates | length) == 0 then null else ($candidates | min_by(.conc)) end) as $canary
                    | {
                        canary: (if $canary == null then [] else [$canary] end),
                        remaining: (
                          .
                          | .single_node = (.single_node // {})
                          | .single_node["1k1k"] = ((.single_node["1k1k"] // []) | remove_one($canary))
                          | .single_node["8k1k"] = ((.single_node["8k1k"] // []) | remove_one($canary))
                        )
                      }
                  ' <<<"$SEARCH_SPACE")
                  echo "canary-config=$(jq -c '.canary' <<<"$selection")" >> "$GITHUB_OUTPUT"
                  echo "remaining-search-space-config=$(jq -c '.remaining' <<<"$selection")" >> "$GITHUB_OUTPUT"

    canary-sweep:
        needs: canary-select
        if: ${{ needs.canary-select.outputs.canary-config != '' && needs.canary-select.outputs.canary-config != '[]' }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: canary /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.canary-select.outputs.canary-config) }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            skip-queue-pr: ${{ matrix.config['skip-queue-pr'] || '' }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
            kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
            tp: ${{ matrix.config.tp }}
            pp: ${{ matrix.config.pp }}
            dcp-size: ${{ matrix.config.dcp-size }}
            pcp-size: ${{ matrix.config.pcp-size }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            run-eval: false

    sweep-multi-node-1k1k:
        needs: [setup, canary-select, canary-sweep]
        if: >-
            ${{
              !cancelled() &&
              needs.setup.result == 'success' &&
              (needs.canary-sweep.result == 'success' || needs.canary-sweep.result == 'skipped') &&
              toJson(fromJson(needs.setup.outputs.search-space-config).multi_node['1k1k']) != 'null'
            }}
        uses: ./.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node 1k1k /
        strategy:
            fail-fast: ${{ inputs.sweep-mode == 'full-sweep-fail-fast' || inputs.sweep-mode == 'full-sweep-fail-fast-no-canary' }}
            matrix:
                config: ${{ fromJson(needs.setup.outputs.search-space-config).multi_node['1k1k'] }}
        secrets: inherit
        with: &multi-node-inputs
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            skip-queue-pr: ${{ matrix.config['skip-queue-pr'] || '' }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
            kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
            exp-name: ${{ matrix.config.exp-name }}
            conc-list: ${{ toJson(matrix.config.conc) }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            prefill-hardware: ${{ matrix.config.prefill.hardware }}
            decode-hardware: ${{ matrix.config.decode.hardware }}

            prefill-num-worker: ${{ matrix.config.prefill.num-worker }}
            prefill-tp: ${{ matrix.config.prefill.tp }}
            prefill-pp: ${{ matrix.config.prefill.pp }}
            prefill-dcp-size: ${{ matrix.config.prefill.dcp-size }}
            prefill-pcp-size: ${{ matrix.config.prefill.pcp-size }}
            prefill-ep: ${{ matrix.config.prefill.ep }}
            prefill-dp-attn: ${{ matrix.config.prefill.dp-attn }}
            prefill-additional-settings: ${{ toJson(matrix.config.prefill.additional-settings) }}

            decode-num-worker: ${{ matrix.config.decode.num-worker }}
            decode-tp: ${{ matrix.config.decode.tp }}
            decode-pp: ${{ matrix.config.decode.pp }}
            decode-dcp-size: ${{ matrix.config.decode.dcp-size }}
            decode-pcp-size: ${{ matrix.config.decode.pcp-size }}
            decode-ep: ${{ matrix.config.decode.ep }}
            decode-dp-attn: ${{ matrix.config.decode.dp-attn }}
            decode-additional-settings: ${{ toJson(matrix.config.decode.additional-settings) }}
            run-eval: false

    sweep-multi-node-8k1k:
        needs: [setup, canary-select, canary-sweep]
        if: >-
            ${{
              !cancelled() &&
              needs.setup.result == 'success' &&
              (needs.canary-sweep.result == 'success' || needs.canary-sweep.result == 'skipped') &&
              toJson(fromJson(needs.setup.outputs.search-space-config).multi_node['8k1k']) != 'null'
            }}
        uses: ./.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node 8k1k /
        strategy:
            fail-fast: ${{ inputs.sweep-mode == 'full-sweep-fail-fast' || inputs.sweep-mode == 'full-sweep-fail-fast-no-canary' }}
            matrix:
                config: ${{ fromJson(needs.setup.outputs.search-space-config).multi_node['8k1k'] }}
        secrets: inherit
        with: *multi-node-inputs

    sweep-single-node-1k1k:
        needs: [setup, canary-select, canary-sweep]
        if: >-
            ${{
              !cancelled() &&
              needs.setup.result == 'success' &&
              (needs.canary-sweep.result == 'success' || needs.canary-sweep.result == 'skipped') &&
              toJson(fromJson((needs.canary-sweep.result == 'success' && needs.canary-select.outputs.remaining-search-space-config) || needs.setup.outputs.search-space-config).single_node['1k1k']) != 'null' &&
              toJson(fromJson((needs.canary-sweep.result == 'success' && needs.canary-select.outputs.remaining-search-space-config) || needs.setup.outputs.search-space-config).single_node['1k1k']) != '[]'
            }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: single-node 1k1k /
        strategy:
            fail-fast: ${{ inputs.sweep-mode == 'full-sweep-fail-fast' || inputs.sweep-mode == 'full-sweep-fail-fast-no-canary' }}
            matrix:
                config: ${{ fromJson((needs.canary-sweep.result == 'success' && needs.canary-select.outputs.remaining-search-space-config) || needs.setup.outputs.search-space-config).single_node['1k1k'] }}
        secrets: inherit
        with: &single-node-inputs
            exp-name: ${{ matrix.config.exp-name }}
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            skip-queue-pr: ${{ matrix.config['skip-queue-pr'] || '' }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
            kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
            tp: ${{ matrix.config.tp }}
            pp: ${{ matrix.config.pp }}
            dcp-size: ${{ matrix.config.dcp-size }}
            pcp-size: ${{ matrix.config.pcp-size }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            run-eval: ${{ matrix.config.run-eval }}

    sweep-single-node-8k1k:
        needs: [setup, canary-select, canary-sweep]
        if: >-
            ${{
              !cancelled() &&
              needs.setup.result == 'success' &&
              (needs.canary-sweep.result == 'success' || needs.canary-sweep.result == 'skipped') &&
              toJson(fromJson((needs.canary-sweep.result == 'success' && needs.canary-select.outputs.remaining-search-space-config) || needs.setup.outputs.search-space-config).single_node['8k1k']) != 'null' &&
              toJson(fromJson((needs.canary-sweep.result == 'success' && needs.canary-select.outputs.remaining-search-space-config) || needs.setup.outputs.search-space-config).single_node['8k1k']) != '[]'
            }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: single-node 8k1k /
        strategy:
            fail-fast: ${{ inputs.sweep-mode == 'full-sweep-fail-fast' || inputs.sweep-mode == 'full-sweep-fail-fast-no-canary' }}
            matrix:
                config: ${{ fromJson((needs.canary-sweep.result == 'success' && needs.canary-select.outputs.remaining-search-space-config) || needs.setup.outputs.search-space-config).single_node['8k1k'] }}
        secrets: inherit
        with: *single-node-inputs

    sweep-agentic:
        needs: [setup, canary-select, canary-sweep]
        if: >-
            ${{
              !cancelled() &&
              needs.setup.result == 'success' &&
              (needs.canary-sweep.result == 'success' || needs.canary-sweep.result == 'skipped') &&
              toJson(fromJson(needs.setup.outputs.search-space-config).single_node['agentic']) != 'null'
            }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: agentic /
        strategy:
            fail-fast: ${{ inputs.sweep-mode == 'full-sweep-fail-fast' || inputs.sweep-mode == 'full-sweep-fail-fast-no-canary' }}
            matrix:
                config: ${{ fromJson(needs.setup.outputs.search-space-config).single_node['agentic'] }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            skip-queue-pr: ${{ matrix.config['skip-queue-pr'] || '' }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
            kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
            tp: ${{ matrix.config.tp }}
            pp: ${{ matrix.config.pp }}
            dcp-size: ${{ matrix.config.dcp-size }}
            pcp-size: ${{ matrix.config.pcp-size }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            kv-offloading: ${{ matrix.config.kv-offloading }}
            kv-offload-backend: ${{ matrix.config['kv-offload-backend'].name }}
            kv-offload-backend-metadata: ${{ matrix.config['kv-offload-backend'] && toJson(matrix.config['kv-offload-backend']) || '' }}
            total-cpu-dram-gb: ${{ matrix.config.total-cpu-dram-gb }}
            duration: ${{ matrix.config.duration }}
            isl: '0'
            osl: '0'
            max-model-len: '0'
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ 'false' }}
            run-eval: false
            scenario-type: agentic-coding

    sweep-multi-node-agentic:
        needs: [setup, canary-select, canary-sweep]
        if: >-
            ${{
              !cancelled() &&
              needs.setup.result == 'success' &&
              (needs.canary-sweep.result == 'success' || needs.canary-sweep.result == 'skipped') &&
              toJson(fromJson(needs.setup.outputs.search-space-config).multi_node['agentic']) != 'null'
            }}
        uses: ./.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node agentic /
        strategy:
            fail-fast: ${{ inputs.sweep-mode == 'full-sweep-fail-fast' || inputs.sweep-mode == 'full-sweep-fail-fast-no-canary' }}
            matrix:
                config: ${{ fromJson(needs.setup.outputs.search-space-config).multi_node['agentic'] }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            isl: '0'
            osl: '0'
            max-model-len: '0'
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            skip-queue-pr: ${{ matrix.config['skip-queue-pr'] || '' }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
            kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
            conc-list: ${{ toJson(matrix.config.conc) }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            prefill-hardware: ${{ matrix.config.prefill.hardware }}
            decode-hardware: ${{ matrix.config.decode.hardware }}
            prefill-num-worker: ${{ matrix.config.prefill.num-worker }}
            prefill-tp: ${{ matrix.config.prefill.tp }}
            prefill-pp: ${{ matrix.config.prefill.pp }}
            prefill-dcp-size: ${{ matrix.config.prefill.dcp-size }}
            prefill-pcp-size: ${{ matrix.config.prefill.pcp-size }}
            prefill-ep: ${{ matrix.config.prefill.ep }}
            prefill-dp-attn: ${{ matrix.config.prefill.dp-attn }}
            prefill-additional-settings: ${{ toJson(matrix.config.prefill.additional-settings) }}
            decode-num-worker: ${{ matrix.config.decode.num-worker }}
            decode-tp: ${{ matrix.config.decode.tp }}
            decode-pp: ${{ matrix.config.decode.pp }}
            decode-dcp-size: ${{ matrix.config.decode.dcp-size }}
            decode-pcp-size: ${{ matrix.config.decode.pcp-size }}
            decode-ep: ${{ matrix.config.decode.ep }}
            decode-dp-attn: ${{ matrix.config.decode.dp-attn }}
            decode-additional-settings: ${{ toJson(matrix.config.decode.additional-settings) }}
            conc: ${{ matrix.config.conc[0] }}
            kv-offloading: ${{ matrix.config.kv-offloading }}
            kv-offload-backend: ${{ matrix.config['kv-offload-backend'].name }}
            kv-offload-backend-metadata: ${{ matrix.config['kv-offload-backend'] && toJson(matrix.config['kv-offload-backend']) || '' }}
            total-cpu-dram-gb: ${{ matrix.config['total-cpu-dram-gb'] }}
            duration: ${{ matrix.config.duration }}
            run-eval: false
            scenario-type: agentic-coding

    sweep-evals:
        needs: [setup, canary-select, canary-sweep]
        if: >-
            ${{
              !cancelled() &&
              needs.setup.result == 'success' &&
              (needs.canary-sweep.result == 'success' || needs.canary-sweep.result == 'skipped') &&
              toJson(fromJson(needs.setup.outputs.search-space-config).evals) != '[]' &&
              toJson(fromJson(needs.setup.outputs.search-space-config).evals) != 'null'
            }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: eval /
        strategy:
            fail-fast: ${{ inputs.sweep-mode == 'full-sweep-fail-fast' || inputs.sweep-mode == 'full-sweep-fail-fast-no-canary' }}
            matrix:
                config: ${{ fromJson(needs.setup.outputs.search-space-config).evals }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            skip-queue-pr: ${{ matrix.config['skip-queue-pr'] || '' }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
            kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
            tp: ${{ matrix.config.tp }}
            pp: ${{ matrix.config.pp }}
            dcp-size: ${{ matrix.config.dcp-size }}
            pcp-size: ${{ matrix.config.pcp-size }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            run-eval: true
            eval-only: true

    sweep-agentic-evals:
        needs: [setup, canary-select, canary-sweep]
        if: >-
            ${{
              !cancelled() &&
              needs.setup.result == 'success' &&
              (needs.canary-sweep.result == 'success' || needs.canary-sweep.result == 'skipped') &&
              toJson(fromJson(needs.setup.outputs.search-space-config).agentic_evals) != '[]' &&
              toJson(fromJson(needs.setup.outputs.search-space-config).agentic_evals) != 'null'
            }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: agentic eval /
        strategy:
            fail-fast: ${{ inputs.sweep-mode == 'full-sweep-fail-fast' || inputs.sweep-mode == 'full-sweep-fail-fast-no-canary' }}
            matrix:
                config: ${{ fromJson(needs.setup.outputs.search-space-config).agentic_evals }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            skip-queue-pr: ${{ matrix.config['skip-queue-pr'] || '' }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
            kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
            tp: ${{ matrix.config.tp }}
            pp: ${{ matrix.config.pp }}
            dcp-size: ${{ matrix.config.dcp-size }}
            pcp-size: ${{ matrix.config.pcp-size }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            kv-offloading: ${{ matrix.config.kv-offloading }}
            kv-offload-backend: ${{ matrix.config['kv-offload-backend'].name }}
            kv-offload-backend-metadata: ${{ matrix.config['kv-offload-backend'] && toJson(matrix.config['kv-offload-backend']) || '' }}
            total-cpu-dram-gb: ${{ matrix.config.total-cpu-dram-gb }}
            duration: ${{ matrix.config.duration }}
            isl: '0'
            osl: '0'
            max-model-len: '0'
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ 'false' }}
            run-eval: true
            eval-only: true
            scenario-type: agentic-coding

    sweep-multi-node-evals:
        needs: [setup, canary-select, canary-sweep]
        if: >-
            ${{
              !cancelled() &&
              needs.setup.result == 'success' &&
              (needs.canary-sweep.result == 'success' || needs.canary-sweep.result == 'skipped') &&
              toJson(fromJson(needs.setup.outputs.search-space-config).multinode_evals) != '[]' &&
              toJson(fromJson(needs.setup.outputs.search-space-config).multinode_evals) != 'null'
            }}
        uses: ./.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node eval /
        strategy:
            fail-fast: ${{ inputs.sweep-mode == 'full-sweep-fail-fast' || inputs.sweep-mode == 'full-sweep-fail-fast-no-canary' }}
            matrix:
                config: ${{ fromJson(needs.setup.outputs.search-space-config).multinode_evals }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            priority: ${{ matrix.config.priority }}
            queue-token: ${{ matrix.config['queue-token'] }}
            skip-queue-pr: ${{ matrix.config['skip-queue-pr'] || '' }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            router: ${{ matrix.config.router && toJson(matrix.config.router) || '' }}
            kv-p2p-transfer: ${{ matrix.config['kv-p2p-transfer'] || '' }}
            conc-list: ${{ toJson(matrix.config.conc) }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            prefill-hardware: ${{ matrix.config.prefill.hardware }}
            decode-hardware: ${{ matrix.config.decode.hardware }}
            prefill-num-worker: ${{ matrix.config.prefill.num-worker }}
            prefill-tp: ${{ matrix.config.prefill.tp }}
            prefill-pp: ${{ matrix.config.prefill.pp }}
            prefill-dcp-size: ${{ matrix.config.prefill.dcp-size }}
            prefill-pcp-size: ${{ matrix.config.prefill.pcp-size }}
            prefill-ep: ${{ matrix.config.prefill.ep }}
            prefill-dp-attn: ${{ matrix.config.prefill.dp-attn }}
            prefill-additional-settings: ${{ toJson(matrix.config.prefill.additional-settings) }}
            decode-num-worker: ${{ matrix.config.decode.num-worker }}
            decode-tp: ${{ matrix.config.decode.tp }}
            decode-pp: ${{ matrix.config.decode.pp }}
            decode-dcp-size: ${{ matrix.config.decode.dcp-size }}
            decode-pcp-size: ${{ matrix.config.decode.pcp-size }}
            decode-ep: ${{ matrix.config.decode.ep }}
            decode-dp-attn: ${{ matrix.config.decode.dp-attn }}
            decode-additional-settings: ${{ toJson(matrix.config.decode.additional-settings) }}
            run-eval: true
            eval-only: true
            eval-conc: ${{ matrix.config['eval-all-concs'] && join(matrix.config.conc, ' ') || matrix.config['eval-conc'] }}

    collect-results:
        needs:
            [
                canary-sweep,
                sweep-single-node-1k1k,
                sweep-single-node-8k1k,
                sweep-agentic,
                sweep-multi-node-1k1k,
                sweep-multi-node-8k1k,
                sweep-multi-node-agentic,
                setup,
            ]
        if: >-
            ${{
              always() &&
              needs.setup.result == 'success' &&
              (
                needs.canary-sweep.result == 'success' ||
                needs.sweep-single-node-1k1k.result != 'skipped' ||
                needs.sweep-single-node-8k1k.result != 'skipped' ||
                needs.sweep-multi-node-1k1k.result != 'skipped' ||
                needs.sweep-multi-node-8k1k.result != 'skipped'
              )
            }}
        uses: ./.github/workflows/collect-results.yml
        secrets: inherit
        with:
            result-prefix: "bmk"

    collect-evals:
        needs: [sweep-evals, sweep-agentic-evals, sweep-multi-node-evals, setup]
        if: ${{ always() && needs.setup.result != 'skipped' && (needs.sweep-evals.result != 'skipped' || needs.sweep-agentic-evals.result != 'skipped' || needs.sweep-multi-node-evals.result != 'skipped') }}
        uses: ./.github/workflows/collect-evals.yml
        secrets: inherit

    upload-changelog-metadata:
        needs: [setup, collect-results]
        if: ${{ always() && needs.setup.result == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - name: Extract and save changelog metadata
              run: |
                  cat <<'CONFIGEOF' > _full_config.json
                  ${{ needs.setup.outputs.search-space-config }}
                  CONFIGEOF
                  jq '.changelog_metadata' _full_config.json > changelog_metadata.json
                  rm -f _full_config.json

            - name: Upload changelog artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: changelog-metadata
                  path: changelog_metadata.json

    calc-success-rate:
        needs: collect-results
        if: ${{ always() && needs.collect-results.result != 'skipped'}}
        runs-on: ubuntu-latest

        env:
            RESULTS_DIR: "results/"
            STATS_FILENAME: "run_stats"
            GITHUB_TOKEN: ${{ secrets.REPO_PAT }}

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  token: ${{ secrets.REPO_PAT }}
                  fetch-depth: 0

            - name: Download results artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: ${{ env.RESULTS_DIR }}
                  pattern: results_*

            - name: Install python dependencies
              run: pip install PyGithub

            - name: Calculate success rate
              run: python3 utils/calc_success_rate.py "$STATS_FILENAME"

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: "run-stats"
                  path: ${{ env.STATS_FILENAME }}.json
