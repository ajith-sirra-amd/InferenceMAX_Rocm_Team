name: Recover Kimi run 40719654583
on:
  workflow_dispatch:
  push:
    branches: [perf/kimi-attnfp8-kv-allgather-20261021]
    paths: [.github/workflows/recover-kimi-run.yml]
permissions:
  contents: read
jobs:
  recover-existing-results:
    runs-on: [self-hosted, "cluster:mi355x-amds-2", "nodes:1"]
    timeout-minutes: 20
    steps:
      - name: Inspect preserved workspace and runner health
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          test "${{ runner.name }}" = "mi355x-amd_pit2_p03_g07"
          workspace=$(realpath "$GITHUB_WORKSPACE")
          test "$(basename "$workspace")" = "InferenceMAX_Rocm_Team"
          date -u
          hostname
          printf 'Workspace: %s\n' "$workspace"
          df -h "$workspace"
          df -i "$workspace"
          quota -s 2>/dev/null || true
          free -h
          ls -l /dev/kfd /dev/dri/render* || true
          docker ps --format '{{.Names}} {{.Status}}'
          docker info --format 'Docker root: {{.DockerRootDir}}'
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          if command -v rocm-smi >/dev/null; then
            timeout 30 rocm-smi --showproductname --showuse --showmemuse || true
          fi
          find "$workspace" -mindepth 1 -maxdepth 1 -printf '%f\n'
          timeout 90 du -x -h --max-depth=2 "$workspace" 2>/dev/null | sort -h | tail -25 || true
          preserved=false
          if [ -e "$workspace/.git" ]; then
            current_sha=$(git -C "$workspace" rev-parse HEAD)
            printf 'Existing checkout: %s\n' "$current_sha"
            if [ "$current_sha" = "bb8bed732f514fd697856c5abd1d2bdd9d56a1e5" ]; then
              test "$workspace" = "$(git -C "$workspace" rev-parse --show-toplevel)"
              preserved=true
            fi
          else
            echo "No checkout in this workspace; prior run evidence is not established on this host."
          fi
          echo "preserved=$preserved" >> "$GITHUB_OUTPUT"
          if [ -d "$workspace/results" ]; then
            find "$workspace/results" -maxdepth 3 -type f -printf '%s %p\n' | sort -nr | sed -n '1,20p'
            stat -c '%y %s %n' "$workspace/results/server.log" "$workspace/results/benchmark.log" || true
          fi
          printf 'Preserved original source: %s\n' "$preserved"
      - name: Upload existing failed-run evidence
        if: steps.inspect.outputs.preserved == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovered-kimi-40719654583
          if-no-files-found: error
          path: |
            kimik3*.json
            results/server.log
            results/benchmark.log
            results/config.yaml
            results/vllm_command.txt
            results/benchmark_command.txt
            results/ccdmap.txt
            results/aiperf_artifacts/profile_export_aiperf*.json
            results/aiperf_artifacts/profile_export_aiperf*.csv
            results/aiperf_artifacts/server_metrics_export.json
            results/aiperf_artifacts/gpu_telemetry_export.jsonl
            results/aiperf_artifacts/logs/*.log
            gpu_metrics.csv
