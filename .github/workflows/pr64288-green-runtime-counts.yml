name: PR64288 isolated runtime-count kernel diagnostic
on:
  push:
    branches: [checks/pr64288-runtime-counts-20261105]
    paths: [.github/workflows/pr64288-green-runtime-counts.yml]
permissions:
  contents: read
  actions: read
env:
  IMAGE: vllm/vllm-openai-rocm:nightly-rocm100-e0d00e4b8eb0c89ec30921d0695cfdd409e9c211@sha256:b1374c3814b6e7706c49968ba17ca3b35484382f7b9fc7115dd3e66068d53f2f
  NATIVE_SHA: 768a5da2a8200b84c28b7d675414c95dfbc3ca55
  BASE_SHA: 69d27bf8002a4634de1699c95fb0aeb22fb86ca5
  REVIEW_PORT: '18988'
  REVIEW_SCOPE: kernels
  GPU_STOP_UTC: '2026-11-05T13:42:35Z'
jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
      - name: Check validation scripts and routing-evidence fixtures
        run: |
          uv venv --python 3.12
          uv pip install pyyaml
          .venv/bin/python utils/atom_attention/pr64288_green_preflight.py
          .venv/bin/python -c "import ast,pathlib; ast.parse(pathlib.Path('utils/atom_attention/pr64288_runtime_counts_diagnostic.py').read_text())"
          bash -n utils/atom_attention/pr64288_runtime_counts_validation.sh
      - name: Require candidate static and rendered documentation validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 41993124155 --repo ajith-sirra-amd/vllm --json conclusion --jq .conclusion)" = success
  predecessor:
    needs: code-checks
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Wait for the memory audit before using GPUs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess, time
          cutoff = datetime.datetime.fromisoformat(os.environ["GPU_STOP_UTC"].replace("Z", "+00:00"))
          while datetime.datetime.now(datetime.timezone.utc) < cutoff:
              run = json.loads(subprocess.check_output([
                  "gh", "api", "repos/ajith-sirra-amd/InferenceMAX_Rocm_Team/actions/runs/42010811107"
              ]))
              assert run["head_sha"] == "f8f707ea2aea2d633aea7506915717dd833eacff"
              print("Predecessor:", run["id"], run["status"], run["conclusion"], flush=True)
              if run["status"] == "completed":
                  assert run["conclusion"] == "success", "Predecessor did not pass"
                  break
              time.sleep(60)
          else:
              raise RuntimeError("GPU reservation cutoff reached")
          PY
  gpu:
    needs: predecessor
    runs-on: [self-hosted, "cluster:mi355x-amds-2", "nodes:1"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          clean: false
      - name: Validate runtime counts with unchanged numerical gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = pit2-p03-g40
          task_work="$GITHUB_WORKSPACE/.pr64288-green/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$task_work"
          task_seconds=$(( $(date -u -d "$GPU_STOP_UTC" +%s) - $(date -u +%s) ))
          test "$task_seconds" -gt 1200
          if [ "$task_seconds" -gt 900 ]; then task_seconds=900; fi
          mkdir -p "$task_work/evidence"
          test -d /share_nfs/models
          timeout --signal=TERM --kill-after=90 "$task_seconds" \
            docker run --rm --init --network host --ipc=host --shm-size=8g \
              --name "pr64288-green-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --device=/dev/kfd --device=/dev/dri \
              -v "$GITHUB_WORKSPACE":/repo:ro -v "$task_work":/work \
              --mount type=bind,source=/share_nfs/models,target=/models,readonly \
              -e PYTHONDONTWRITEBYTECODE=1 -e NATIVE_SHA -e BASE_SHA -e REVIEW_PORT -e REVIEW_SCOPE \
              -e TORCH_BLAS_PREFER_HIPBLASLT=0 -e TORCH_BLAS_PREFER_CUBLASLT=0 \
              --entrypoint bash "$IMAGE" /repo/utils/atom_attention/pr64288_runtime_counts_validation.sh
      - name: Stop only this run's container
        if: always()
        shell: bash
        run: |
          container="pr64288-green-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if docker ps --format '{{.Names}}' | grep -Fxq "$container"; then
            docker stop --time 60 "$container"
          fi
      - name: Restore evidence ownership
        if: always()
        shell: bash
        run: |
          task_evidence="$GITHUB_WORKSPACE/.pr64288-green/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/evidence"
          if [ -d "$task_evidence" ]; then
            test ! -L "$task_evidence"
            workspace_real="$(realpath -e -- "$GITHUB_WORKSPACE")"
            test "$(realpath -e -- "$task_evidence")" = "$workspace_real/.pr64288-green/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/evidence"
            docker run --rm --network none --user 0:0 \
              --mount "type=bind,source=$task_evidence,target=/repair" \
              --entrypoint chown "$IMAGE" \
              --recursive --no-dereference -P -- "$(id -u):$(id -g)" /repair
          fi
      - name: Upload kernels validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr64288-runtime-counts-validation
          path: .pr64288-green/${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          include-hidden-files: true
          if-no-files-found: error
