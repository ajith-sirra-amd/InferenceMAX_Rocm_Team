name: Inspect failed native startup
on:
  push:
    branches: [perf/kimi-attnfp8-kv-allgather-20261021]
    paths: [.github/workflows/recover-native-stacks.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, "cluster:mi355x-amds-2", "nodes:1"]
    timeout-minutes: 10
    steps:
      - name: Read kernel and host diagnostics after startup failure
        shell: bash
        run: |
          set -euo pipefail
          test "${{ runner.name }}" = "mi355x-amd_pit2_p03_g07"
          task_workspace="$(realpath -e "$GITHUB_WORKSPACE")"
          test "$(basename "$task_workspace")" = "InferenceMAX_Rocm_Team"
          date -u
          hostname
          free -h
          df -h "$task_workspace"
          printf '\nHOST KERNEL LOG: failed-run time window\n'
          journalctl -k --since "2026-11-02 06:50:00 UTC" --until "2026-11-02 07:08:00 UTC" --no-pager 2>&1 | grep -Ei 'out of memory|killed process|oom|segfault|amdgpu|denied|permission|hint|no journal' | tail -60 || true
          printf '\nRECENT KERNEL ERRORS\n'
          dmesg -T 2>&1 | grep -Ei 'out of memory|killed process|oom|segfault|amdgpu|denied|permitted' | tail -40 || true
          printf '\nREMAINING REPOSITORY EVIDENCE\n'
          find "$task_workspace" -maxdepth 2 -type d -name native_worker_stacks -print
          printf '\nFAILED CONTAINER EVENTS\n'
          timeout 10 docker events --since "2026-11-02T06:50:00Z" --until "2026-11-02T07:08:00Z" --filter container=bmk-server-41402358706-1-mi355x-amd_pit2_p03_g07 --format '{{json .}}' || true
          printf '\nGPU HEALTH\n'
          if command -v rocm-smi >/dev/null; then
            timeout 30 rocm-smi --showuse --showmemuse --showrasinfo || true
          fi