name: Native FP8 validation harness checks
on:
  workflow_dispatch:
  push:
    paths:
      - utils/atom_attention/native_vllm_gpu_validate.py
      - utils/atom_attention/native_validation_plugin/**
      - utils/atom_attention/test_native_validation.py
      - .github/workflows/native-fp8-harness-checks.yml
      - .github/workflows/e2e-tests.yml
      - .github/workflows/benchmark-tmpl.yml
      - runners/launch_mi355x-amd.sh
      - upstream/InferenceX/benchmarks/single_node/agentic/kimik3_fp4_mi355x_mtp.sh
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.ci-cache/pip
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check native validation behavior
        run: |
          python3 -m venv .ci-env
          .ci-env/bin/python -m pip install pytest pyyaml
          .ci-env/bin/python -m pytest -q utils/atom_attention/test_native_validation.py --junitxml=native-harness-checks.xml
          .ci-env/bin/python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/e2e-tests.yml').read_text())
          for step in workflow['jobs']['inspect-runner']['steps']:
              if 'run' in step:
                  subprocess.run(['bash', '-n'], input=step['run'], text=True, check=True)
          PY
          bash -n upstream/InferenceX/benchmarks/single_node/agentic/kimik3_fp4_mi355x_mtp.sh
          bash -n runners/launch_mi355x-amd.sh
          .ci-env/bin/python utils/test_mi355x_container_launcher.py
      - name: Upload CPU check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-harness-cpu-checks
          path: native-harness-checks.xml
          if-no-files-found: error
