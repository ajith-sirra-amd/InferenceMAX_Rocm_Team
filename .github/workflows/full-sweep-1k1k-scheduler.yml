name: Full Sweep Scheduler - 1k1k

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  mega-run:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 
      uses: actions/checkout@v4
      env:
        GH_TOKEN: ${{ secrets.GH_TKN_SROK }}
      with:
        ref: atom # Specify the branch name here
    - name: Run
      uses: ./.github/workflows/full-sweep-tmpl.yml
      with:
        run_1k1k: true
        run_8k1k: false
        run_1k8k: false
        run_dsr1: true
        run_gptoss: true
        use_mi355x: true
        atom_image: "rocm/atom:latest"