            IPAT_PR_MANIFEST: ${{ inputs.pr-runtime-manifest }}
            IPAT_PR_OUTPUT: /share_nfs/gguasti/benchmarks/pr-mxfp4-${{ github.run_id }}-${{ github.run_attempt }}
            PYTHONDONTWRITEBYTECODE: '1'
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: pr-${{ github.run_id }}
                  persist-credentials: false
            - name: Verify images and native distributed model
              working-directory: pr-${{ github.run_id }}
              run: |
                  set -eo pipefail
                  mkdir -p "$IPAT_PR_OUTPUT"
                  IPAT_METADATA=1 bash benchmarks/pr_runtime/mxfp4_check.sh 2>&1 | tee "$IPAT_PR_OUTPUT/workflow.log"
            - name: Stop only this qualification's containers
              if: always()
              run: |
                  docker ps -aq --filter "label=ipat.pr.output=$IPAT_PR_OUTPUT" | xargs -r docker rm -f
            - name: Preserve native distributed qualification evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
