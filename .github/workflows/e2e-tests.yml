name: End-to-End Tests
run-name: e2e Test - ${{ inputs.test-name || github.event.inputs.test-name || inputs.generate-cli-command || github.event.inputs.generate-cli-command }}

on:
    workflow_dispatch:
        inputs:
            generate-cli-command:
                description: "Command passed to generate matrix script"
                required: true
                type: choice
                options:
                - "PR67372 MXFP4 compatibility build"
                - "PR67373 MXFP4 compatibility build"
                - "PR67372 MXFP4 kernel check"
                - "PR67373 MXFP4 kernel check"
                - "PR67372 MXFP4 numerical check"
                - "PR67373 MXFP4 numerical check"
                - "PR67372 MXFP4 metadata check"
                - "PR67373 MXFP4 metadata check"
                - "PR67372 model screen"
                - "PR67373 model screen"
                - "PR67372 TP8 projection"
                - "PR67372 ROCm correctness"
                - "PR67372 correctness"
                - "PR67373 correctness"
                - "PR67372 prepare runtimes"
                - "PR67373 prepare runtimes"
                - "Natural verifier diagnostic Kimi baseline"
                - "Natural verifier diagnostic GPU ownership"
                - "Natural verifier diagnostic Wait for idle GPUs"
                - "Agentic Kimi baseline + MoE front + DSpark"
                - "Natural validation Kimi baseline + MoE front + DSpark"
                - "Fixed-length Kimi baseline"
                - "Fixed-length Kimi AttnRes"
                - "Fixed-length Kimi DSpark"
                - "Fixed-length Kimi MoE front"
                - "Fixed-length Kimi MoE front + DSpark"
