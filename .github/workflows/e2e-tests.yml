        if: ${{ (inputs.generate-cli-command == 'PR67372 MXFP4 compatibility build' || inputs.generate-cli-command == 'PR67373 MXFP4 compatibility build') }}
        name: DSpark paired MXFP4 compatibility build
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
