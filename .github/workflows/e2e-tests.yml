name: End-to-End Tests
run-name: e2e Test - ${{ inputs.test-name || github.event.inputs.test-name || inputs.generate-cli-command || github.event.inputs.generate-cli-command }}

on:
    workflow_dispatch:
        inputs:
            benchmark-request:
                description: "Frozen custom benchmark or diagnostic request JSON"
                required: false
                type: string
                default: ""
            sa-config:
                description: "Native SA configuration file in this repository"
                required: false
                type: string
            allocation-id:
                description: "Optional existing reservation; leave empty to run directly on the selected runner"
                required: false
                type: string
            sa-mode:
                description: "Replicate the SA datapoint or check local container transport"
                required: false
                type: choice
                default: replication
                options: [replication, transport-check]
            sa-check-command:
                description: "Optional diagnostic argv as a JSON string array; used only in transport-check mode"
                required: false
                type: string
            generate-cli-command:
                description: "Command passed to generate matrix script"
                required: true
                type: choice
                options:
                - "Single benchmark"
                # - "test-config  --config-files .github/configs/amd-master.yaml --config-keys dsv4-fp4-mi355x-atom-agentic-lmcache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys dsv4-fp4-mi355x-sglang-agentic-hicache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys minimaxm2.5-fp4-mi355x-vllm-agentic-lmcache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys minimaxm2.5-fp8-mi355x-vllm-agentic-lmcache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys kimik2.5-fp4-mi355x-vllm-agentic-lmcache"
                # - "test-config --config-files .github/configs/nvidia-master.yaml --config-keys kimik2.5-fp4-b200-vllm-agentic-lmcache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys qwen3.5-fp8-mi355x-sglang-agentic-hicache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys qwen3.5-fp4-mi355x-sglang-agentic-hicache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys glm5.1-fp4-mi355x-sglang-agentic-hicache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys glm5.1-fp8-mi355x-sglang-agentic-hicache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys glm5.1-fp8-mi300x-sglang-agentic"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys glm5.1-fp8-mi300x-sglang-agentic-hicache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys glm5.1-fp8-mi300x-sglang-agentic-smoke"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys qwen3.5-fp8-mi300x-sglang-agentic"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys qwen3.5-fp8-mi300x-sglang-agentic-hicache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys qwen3.5-fp8-mi300x-sglang-agentic-smoke"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys minimaxm2.5-fp8-mi300x-vllm-agentic-lmcache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys minimaxm2.5-fp8-mi325x-vllm-agentic-lmcache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys dsv4-fp4-mi355x-sglang-agentic-hicache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys dsv4-fp4-mi355x-vllm-agentic-lmcache"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys dsv4-fp4-mi355x-sglang"
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys kimik2.7-fp4-mi355x-vllm-agentic-lmcache"               
                # - "test-config --config-files .github/configs/amd-master.yaml --config-keys minimaxm3-fp8-mi355x-vllm-agentic-lmcache"
                - "test-config --config-files upstream/InferenceX/configs/amd-master.yaml --config-keys kimik3-fp4-mi355x-vllm-agentic-mtp"
                - "test-config --config-files upstream/InferenceX/configs/amd-master.yaml --config-keys kimik3-fp4-mi355x-vllm-agentic-mtp-andy"
                - "test-config --config-files upstream/InferenceX/configs/amd-master.yaml --config-keys minimaxm3-fp4-mi355x-vllm-agentic-mtp"
                - "test-config --config-files upstream/InferenceX/configs/amd-master.yaml --config-keys glm5.2-fp4-mi355x-sglang-agentic"
                - "test-config --config-files upstream/InferenceX/configs/amd-master.yaml --config-keys glm5.2-fp4-mi355x-sglang-agentic-mtp"
                - "test-config --config-files upstream/InferenceX/configs/amd-master.yaml --config-keys glm5.2-fp4-mi355x-sglang-agentic-mtp-dpa"
            test-name:
                description: "Custom run name (shown in the Actions list). Empty = use the config command."
                required: false
                type: string
                default: ""
            ref:
                description: "Ref (branch/sha) to checkout for generating configs"
                required: false
                type: string
            duration-override:
                description: "Override matrix.config.duration (seconds). Empty = use matrix value."
                required: false
                type: string
                default: ""
    workflow_call:
        inputs:
            generate-cli-command:
                description: "Command passed to generate matrix script"
                required: true
                type: string
            test-name:
                description: "Name for this test run"
                required: false
                type: string
            ref:
                description: "Ref (branch/sha) to checkout for generating configs"
                required: false
                type: string
            duration-override:
                description: "Override matrix.config.duration (seconds). Empty = use matrix value."
                required: false
                type: string
                default: ""

jobs:
    benchmark:
        if: ${{ inputs.benchmark-request != '' }}
        runs-on: ${{ fromJSON(inputs.benchmark-request).labels }}
        timeout-minutes: 480
        permissions:
            contents: read
        env:
            BENCHMARK_OUTPUT: /share_nfs/ajith/benchmarks/runs/${{ github.run_id }}-${{ github.run_attempt }}
        concurrency:
            group: benchmark-${{ join(fromJSON(inputs.benchmark-request).labels, '-') }}
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
                  persist-credentials: false
            - name: Run frozen BENCHMARK request
              if: ${{ fromJSON(inputs.benchmark-request).mode != 'run' }}
              working-directory: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
              env:
                  BENCHMARK_REQUEST: ${{ inputs.benchmark-request }}
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: python3 benchmarks/tools/runner.py --output "$BENCHMARK_OUTPUT"
            - name: Phase 2 - Replicate SA run
              if: ${{ fromJSON(inputs.benchmark-request).mode == 'run' && contains(fromJSON(inputs.benchmark-request).passes, 'baseline') }}
              working-directory: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
              env:
                  BENCHMARK_REQUEST: ${{ inputs.benchmark-request }}
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: python3 benchmarks/tools/runner.py --output "$BENCHMARK_OUTPUT" --stage baseline
            - name: Phase 3 - Profile and aggregate kernels
              if: ${{ fromJSON(inputs.benchmark-request).mode == 'run' && contains(fromJSON(inputs.benchmark-request).passes, 'profile') }}
              working-directory: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
              env:
                  BENCHMARK_REQUEST: ${{ inputs.benchmark-request }}
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: python3 benchmarks/tools/runner.py --output "$BENCHMARK_OUTPUT" --stage profile
            - name: Stop owned container and restore evidence ownership
              if: always()
              working-directory: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
              run: python3 benchmarks/tools/runner.py --cleanup --output "$BENCHMARK_OUTPUT"
            - name: Preserve BENCHMARK evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: benchmark-${{ fromJSON(inputs.benchmark-request).id }}
                  path: |
                      ${{ env.BENCHMARK_OUTPUT }}/*.json
                      ${{ env.BENCHMARK_OUTPUT }}/*.txt
                      ${{ env.BENCHMARK_OUTPUT }}/*.log
                      ${{ env.BENCHMARK_OUTPUT }}/*.md
                      ${{ env.BENCHMARK_OUTPUT }}/*.html
                      ${{ env.BENCHMARK_OUTPUT }}/capabilities/**
                      ${{ env.BENCHMARK_OUTPUT }}/model-metadata/**
                      ${{ env.BENCHMARK_OUTPUT }}/rocprof-check/**
                      ${{ env.BENCHMARK_OUTPUT }}/baseline/**
                      ${{ env.BENCHMARK_OUTPUT }}/profile/**
                      ${{ env.BENCHMARK_OUTPUT }}/preflight/**
                      ${{ env.BENCHMARK_OUTPUT }}/recovered/**
                      !${{ env.BENCHMARK_OUTPUT }}/**/client-env
                      !${{ env.BENCHMARK_OUTPUT }}/**/client-tools
                      !${{ env.BENCHMARK_OUTPUT }}/**/work
                  if-no-files-found: error
                  retention-days: 30
    sa-benchmark:
        if: ${{ inputs.sa-config != '' }}
        name: Native SA benchmark
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
        timeout-minutes: 480
        permissions:
            contents: read
            actions: read
        concurrency:
            group: sa-mi355x-single-node
            cancel-in-progress: false
        env:
            SA_OUTPUT: /share_nfs/ajith/benchmarks/${{ github.run_id }}-${{ github.run_attempt }}
            PYTHONDONTWRITEBYTECODE: '1'
        steps:
            - name: Release disposable environments from completed native runs
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  python3 - <<'PY'
                  import json, os, re, shutil, urllib.error, urllib.request
                  from pathlib import Path
                  workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
                  output = Path(os.environ['SA_OUTPUT'])
                  output.mkdir(parents=True, exist_ok=True)
                  removed = []
                  for checkout in sorted(workspace.glob('sa-benchmark-*')):
                      match = re.fullmatch(r'sa-benchmark-(\d+)', checkout.name)
                      if not match or match[1] == os.environ['GITHUB_RUN_ID'] or checkout.is_symlink():
                          continue
                      environments = [p for p in checkout.glob('.sa-runs/*/srt-slurm/.venv*')
                                      if p.is_dir() and not p.is_symlink() and p.resolve().is_relative_to(checkout)]
                      if not environments:
                          continue
                      request = urllib.request.Request(
                          os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + match[1],
                          headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
                      try:
                          with urllib.request.urlopen(request, timeout=30) as response:
                              state = json.load(response)
                      except urllib.error.HTTPError as error:
                          if error.code != 404:
                              raise
                          print('Retaining environment: workflow status unavailable for', match[1], flush=True)
                          continue
                      if state['status'] != 'completed':
                          continue
                      for environment in environments:
                          if environment.stat().st_uid != os.getuid():
                              continue
                          print('Removing regenerable environment:', environment, flush=True)
                          shutil.rmtree(environment)
                          removed.append(str(environment))
                  (output / 'environment-cleanup.json').write_text(json.dumps({'removed': removed}, indent=2) + '\n')
                  PY
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: sa-benchmark-${{ github.run_id }}
                  sparse-checkout: benchmarks/sa
                  persist-credentials: false
            - name: Stop leftover native containers from completed runs
              working-directory: sa-benchmark-${{ github.run_id }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: python3 benchmarks/sa/cleanup.py --completed --output "$SA_OUTPUT"
            - name: Check container transport
              if: ${{ inputs.sa-mode == 'transport-check' }}
              working-directory: sa-benchmark-${{ github.run_id }}
              env:
                  SA_CONFIG: ${{ inputs.sa-config }}
                  SA_ALLOCATION: ${{ inputs.allocation-id }}
                  SA_CHECK_COMMAND: ${{ inputs.sa-check-command }}
              run: python3 benchmarks/sa/check_transport.py --config "$SA_CONFIG" --allocation "$SA_ALLOCATION" --output "$SA_OUTPUT"
            - name: Replicate selected SA datapoint
              if: ${{ inputs.sa-mode != 'transport-check' }}
              working-directory: sa-benchmark-${{ github.run_id }}
              env:
                  SA_CONFIG: ${{ inputs.sa-config }}
                  SA_ALLOCATION: ${{ inputs.allocation-id }}
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -o pipefail
                  mkdir -p "$SA_OUTPUT"
                  python3 benchmarks/sa/run.py --config "$SA_CONFIG" --allocation "$SA_ALLOCATION" --output "$SA_OUTPUT" 2>&1 | tee "$SA_OUTPUT/workflow.log"
            - name: Stop this run's remaining native containers
              if: always()
              working-directory: sa-benchmark-${{ github.run_id }}
              run: python3 benchmarks/sa/cleanup.py --output "$SA_OUTPUT"
            - name: Preserve native results and logs
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: sa-benchmark-${{ github.run_id }}
                  path: |
                      ${{ env.SA_OUTPUT }}/*.json
                      ${{ env.SA_OUTPUT }}/*.jsonl
                      ${{ env.SA_OUTPUT }}/*.yaml
                      ${{ env.SA_OUTPUT }}/*.txt
                      ${{ env.SA_OUTPUT }}/*.log
                      ${{ env.SA_OUTPUT }}/rendered/**
                      ${{ env.SA_OUTPUT }}/native/**
                  retention-days: 30
    get-jobs:
        if: ${{ !inputs.sa-config && !inputs.benchmark-request }}
        runs-on: ubuntu-latest
        outputs:
            single-node-config: ${{ steps.get-jobs.outputs.single-node-config }}
            multi-node-config: ${{ steps.get-jobs.outputs.multi-node-config }}
            eval-config: ${{ steps.get-jobs.outputs.eval-config }}
            multi-node-eval-config: ${{ steps.get-jobs.outputs.multi-node-eval-config }}
            agentic-config: ${{ steps.get-jobs.outputs.agentic-config }}
            multi-node-agentic-config: ${{ steps.get-jobs.outputs.multi-node-agentic-config }}
        steps:
            - name: Checkout code (ref)
              if: ${{ inputs.ref && inputs.ref != '' }}
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                ref: ${{ inputs.ref }}

            - name: Checkout code (default)
              if: ${{ !inputs.ref || inputs.ref == '' }}
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                ref: ${{ github.sha }}

            - id: get-jobs
              run: |
                  pip install pydantic
                  CONFIG_JSON=$(python3 ${GITHUB_WORKSPACE}/utils/matrix_logic/generate_sweep_configs.py \
                    ${{ inputs.generate-cli-command || github.event.inputs.generate-cli-command }})
                  AGENTIC=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if x.get('scenario-type') == 'agentic-coding' and 'prefill' not in x]))")
                  MULTI_AGENTIC=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if x.get('scenario-type') == 'agentic-coding' and 'prefill' in x]))")
                  SINGLE=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' not in x and x.get('scenario-type') != 'agentic-coding' and not x.get('eval-only', False)]))")
                  MULTI=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' in x and x.get('scenario-type') != 'agentic-coding' and not x.get('eval-only', False)]))")
                  EVALS=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' not in x and x.get('scenario-type') != 'agentic-coding' and x.get('run-eval', False)]))")
                  MULTI_EVAL=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' in x and x.get('run-eval', False)]))")
                  echo "agentic-config=$AGENTIC" >> $GITHUB_OUTPUT
                  echo "multi-node-agentic-config=$MULTI_AGENTIC" >> $GITHUB_OUTPUT
                  echo "single-node-config=$SINGLE" >> $GITHUB_OUTPUT
                  echo "multi-node-config=$MULTI" >> $GITHUB_OUTPUT
                  echo "eval-config=$EVALS" >> $GITHUB_OUTPUT
                  echo "multi-node-eval-config=$MULTI_EVAL" >> $GITHUB_OUTPUT

    test-sweep-multi-node:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-config != '[]' }}
        uses: ./.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.multi-node-config) }}
        secrets: inherit
        with:
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            exp-name: ${{ matrix.config.exp-name }}
            conc-list: ${{ toJson(matrix.config.conc) }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}

            prefill-num-worker: ${{ matrix.config.prefill.num-worker }}
            prefill-tp: ${{ matrix.config.prefill.tp }}
            prefill-ep: ${{ matrix.config.prefill.ep }}
            prefill-dp-attn: ${{ matrix.config.prefill.dp-attn }}
            prefill-additional-settings: ${{ toJson(matrix.config.prefill.additional-settings) }}

            decode-num-worker: ${{ matrix.config.decode.num-worker }}
            decode-tp: ${{ matrix.config.decode.tp }}
            decode-ep: ${{ matrix.config.decode.ep }}
            decode-dp-attn: ${{ matrix.config.decode.dp-attn }}
            decode-additional-settings: ${{ toJson(matrix.config.decode.additional-settings) }}
            run-eval: false
            ref: ${{ inputs.ref }}

    test-sweep-multi-node-evals:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-eval-config != '[]' }}
        uses: ./.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node eval /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.multi-node-eval-config) }}
        secrets: inherit
        with:
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            exp-name: ${{ matrix.config.exp-name }}
            conc-list: ${{ toJson(matrix.config.conc) }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}

            prefill-num-worker: ${{ matrix.config.prefill.num-worker }}
            prefill-tp: ${{ matrix.config.prefill.tp }}
            prefill-ep: ${{ matrix.config.prefill.ep }}
            prefill-dp-attn: ${{ matrix.config.prefill.dp-attn }}
            prefill-additional-settings: ${{ toJson(matrix.config.prefill.additional-settings) }}

            decode-num-worker: ${{ matrix.config.decode.num-worker }}
            decode-tp: ${{ matrix.config.decode.tp }}
            decode-ep: ${{ matrix.config.decode.ep }}
            decode-dp-attn: ${{ matrix.config.decode.dp-attn }}
            decode-additional-settings: ${{ toJson(matrix.config.decode.additional-settings) }}
            run-eval: true
            eval-only: true
            eval-conc: ${{ matrix.config.eval-conc }}
            ref: ${{ inputs.ref }}

    test-sweep-agentic:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.agentic-config != '[]' }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: agentic /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.agentic-config) }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            tp: ${{ matrix.config.tp }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            offloading: ${{ matrix.config.offloading }}
            kv-offloading: ${{ matrix.config['kv-offloading'] }}
            kv-offload-backend: ${{ matrix.config['kv-offload-backend'].name }}
            total-cpu-dram-gb: ${{ matrix.config.total-cpu-dram-gb }}
            duration: ${{ inputs.duration-override != '' && inputs.duration-override || matrix.config.duration }}
            isl: '0'
            osl: '0'
            max-model-len: '0'
            spec-decoding: ${{ matrix.config['spec-decoding'] }}
            disagg: 'false'
            run-eval: false
            scenario-type: agentic-coding
            ref: ${{ inputs.ref }}

    test-sweep-multi-node-agentic:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-agentic-config != '[]' }}
        uses: ./.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node agentic /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.multi-node-agentic-config) }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            isl: '0'
            osl: '0'
            max-model-len: '0'
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            conc-list: '[${{ matrix.config.conc }}]'
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            prefill-num-worker: ${{ matrix.config.prefill.num-worker }}
            prefill-tp: ${{ matrix.config.prefill.tp }}
            prefill-ep: ${{ matrix.config.prefill.ep }}
            prefill-dp-attn: ${{ matrix.config.prefill.dp-attn }}
            prefill-additional-settings: ${{ toJson(matrix.config.prefill.additional-settings) }}
            decode-num-worker: ${{ matrix.config.decode.num-worker }}
            decode-tp: ${{ matrix.config.decode.tp }}
            decode-ep: ${{ matrix.config.decode.ep }}
            decode-dp-attn: ${{ matrix.config.decode.dp-attn }}
            decode-additional-settings: ${{ toJson(matrix.config.decode.additional-settings) }}
            conc: ${{ matrix.config.conc }}
            duration: ${{ inputs.duration-override != '' && inputs.duration-override || matrix.config.duration }}
            run-eval: false
            scenario-type: agentic-coding
            ref: ${{ inputs.ref }}

    test-sweep-single-node:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.single-node-config != '[]' }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: single-node /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.single-node-config) }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            tp: ${{ matrix.config.tp }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            run-eval: false
            ref: ${{ inputs.ref }}

    test-sweep-evals:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.eval-config != '[]' }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: eval /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.eval-config) }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            tp: ${{ matrix.config.tp }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            run-eval: true
            eval-only: true
            ref: ${{ inputs.ref }}

    collect-results:
        needs: [test-sweep-multi-node, test-sweep-single-node, test-sweep-agentic, test-sweep-multi-node-agentic]
        if: ${{ always() && (needs.test-sweep-multi-node.result != 'skipped' || needs.test-sweep-single-node.result != 'skipped' || needs.test-sweep-agentic.result != 'skipped' || needs.test-sweep-multi-node-agentic.result != 'skipped') }}
        uses: ./.github/workflows/collect-results.yml
        secrets: inherit
        with:
            result-prefix: "bmk"

    collect-evals:
        needs: [test-sweep-evals, test-sweep-multi-node-evals]
        if: ${{ always() && (needs.test-sweep-evals.result != 'skipped' || needs.test-sweep-multi-node-evals.result != 'skipped') }}
        uses: ./.github/workflows/collect-evals.yml
        secrets: inherit

    collect-agentic-results:
        needs: [test-sweep-agentic, test-sweep-multi-node-agentic]
        if: ${{ always() && (needs.test-sweep-agentic.result != 'skipped' || needs.test-sweep-multi-node-agentic.result != 'skipped') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  token: ${{ secrets.REPO_PAT }}
                  submodules: true

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: pip install pandas matplotlib numpy

            - name: Download agentic artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: 'agentic_*'
                  path: results/

            - name: Run aggregation
              env:
                  PYTHONPATH: ${GITHUB_WORKSPACE}/upstream/InferenceX/utils/agentic-benchmark/scripts:${GITHUB_WORKSPACE}/upstream/InferenceX/utils/agentic-benchmark/analysis
              run: |
                  python ${GITHUB_WORKSPACE}/upstream/InferenceX/utils/agentic-benchmark/scripts/collect_sweep_results.py results/ aggregated/

            - name: Upload aggregated results
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: agentic_aggregated
                  path: aggregated/
            
            - name: Cleanup
              run: |
                  rm -rf results

