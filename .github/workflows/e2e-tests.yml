                required: false
                type: string
                default: ""
            pr-runtime-manifest:
                description: "Prepared digest-pinned PR pair manifest under /share_nfs/ajith; required for PR correctness"
                required: false
                type: string
                default: ""
            ref:
                description: "Ref (branch/sha) to checkout for generating configs"
                required: false
                type: string
            duration-override:
                description: "Override matrix.config.duration (seconds). Empty = use matrix value."
                required: false
                type: string
                default: ""
    workflow_call:
        inputs:
            pr-runtime-manifest:
                description: "Prepared digest-pinned PR pair manifest"
                required: false
                type: string
                default: ""
            generate-cli-command:
                description: "Command passed to generate matrix script"
                required: true
                type: string
            test-name:
                description: "Name for this test run"
                required: false
                type: string
            ref:
                description: "Ref (branch/sha) to checkout for generating configs"
                required: false
                type: string
            duration-override:
                description: "Override matrix.config.duration (seconds). Empty = use matrix value."
                required: false
                type: string
                default: ""

jobs:
    pr-runtime-build:
        if: ${{ inputs.generate-cli-command == 'PR67372 prepare runtimes' || inputs.generate-cli-command == 'PR67373 prepare runtimes' }}
        name: Prepare exact PR baseline and candidate ROCm runtimes
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
        timeout-minutes: 360
        permissions:
            contents: read
        concurrency:
            group: sa-mi355x-single-node
            cancel-in-progress: false
        env:
            IPAT_PR_NUMBER: ${{ inputs.generate-cli-command == 'PR67372 prepare runtimes' && '67372' || '67373' }}
            IPAT_PR_DATA_ROOT: /share_nfs/gguasti/benchmarks
            IPAT_PR_OUTPUT: /share_nfs/gguasti/benchmarks/pr-build-${{ github.run_id }}-${{ github.run_attempt }}
            PYTHONDONTWRITEBYTECODE: '1'
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: pr-${{ github.run_id }}
                  persist-credentials: false
            - name: Build shared dependencies and full source runtimes without GPUs
              working-directory: pr-${{ github.run_id }}
              run: |
                  set -eo pipefail
                  mkdir -p "$IPAT_PR_OUTPUT"
                  python3 -u benchmarks/pr_runtime/build.py --pr "$IPAT_PR_NUMBER" \
                      --output "$IPAT_PR_OUTPUT/runtime" 2>&1 | tee "$IPAT_PR_OUTPUT/build.log"
            - name: Stop only this build job's probes
              if: always()
              run: |
                  docker ps -aq --filter "label=ipat.pr.output=$IPAT_PR_OUTPUT" | xargs -r docker rm -f
            - name: Preserve build identities and failures
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: kimi-pr-runtime-build-${{ github.run_id }}
                  path: |
                      ${{ env.IPAT_PR_OUTPUT }}/**
                      !${{ env.IPAT_PR_OUTPUT }}/**/work/**
                  retention-days: 30
                  if-no-files-found: error
    pr-correctness:
        if: ${{ inputs.generate-cli-command == 'PR67372 correctness' || inputs.generate-cli-command == 'PR67372 ROCm correctness' || inputs.generate-cli-command == 'PR67373 correctness' }}
        name: Exact PR runtime verification and component correctness
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
        timeout-minutes: 100
        permissions:
            contents: read
        concurrency:
            group: sa-mi355x-single-node
            cancel-in-progress: false
        env:
            IPAT_PR_NUMBER: ${{ (inputs.generate-cli-command == 'PR67372 correctness' || inputs.generate-cli-command == 'PR67372 ROCm correctness') && '67372' || '67373' }}
            IPAT_PR_DEVICE: ${{ inputs.generate-cli-command == 'PR67372 correctness' && 'cpu' || 'rocm' }}
            IPAT_PR_MANIFEST: ${{ inputs.pr-runtime-manifest }}
            IPAT_PR_DATA_ROOT: /share_nfs/gguasti/benchmarks
            IPAT_PR_OUTPUT: /share_nfs/gguasti/benchmarks/pr-correctness-${{ github.run_id }}-${{ github.run_attempt }}
            PYTHONDONTWRITEBYTECODE: '1'
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: pr-${{ github.run_id }}
                  persist-credentials: false
            - name: Verify both prepared runtimes and execute candidate suite
              working-directory: pr-${{ github.run_id }}
              run: |
                  set -eo pipefail
                  mkdir -p "$IPAT_PR_OUTPUT"
                  bash benchmarks/pr_runtime/correctness.sh 2>&1 | tee "$IPAT_PR_OUTPUT/workflow.log"
            - name: Stop only this correctness job's containers
              if: always()
              run: |
                  container="kimi-pr-correctness-pr-correctness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
                  timeout 50s docker stop --time 45 "$container" || true
                  timeout 10s docker rm -f "$container" "$container-ownership" || true
                  docker ps -aq --filter "label=ipat.pr.output=$IPAT_PR_OUTPUT" | xargs -r docker rm -f
            - name: Preserve runtime identities and correctness evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: kimi-pr-correctness-${{ github.run_id }}
                  path: ${{ env.IPAT_PR_OUTPUT }}/**
                  retention-days: 30
                  if-no-files-found: error
    pr-projection:
        if: ${{ inputs.generate-cli-command == 'PR67372 TP8 projection' }}
        name: DSpark native TP8 BF16 projection and graph qualification
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
        timeout-minutes: 45
        permissions:
            contents: read
        concurrency:
            group: sa-mi355x-single-node
            cancel-in-progress: false
        env:
            IPAT_PR_DATA_ROOT: /share_nfs/gguasti/benchmarks
            IPAT_PR_MANIFEST: ${{ inputs.pr-runtime-manifest }}
            IPAT_PR_OUTPUT: /share_nfs/gguasti/benchmarks/pr-projection-${{ github.run_id }}-${{ github.run_attempt }}
            PYTHONDONTWRITEBYTECODE: '1'
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: pr-${{ github.run_id }}
                  persist-credentials: false
            - name: Verify images and native distributed projection
              working-directory: pr-${{ github.run_id }}
              run: |
                  set -eo pipefail
                  mkdir -p "$IPAT_PR_OUTPUT"
                  bash benchmarks/pr_runtime/projection_check.sh 2>&1 | tee "$IPAT_PR_OUTPUT/workflow.log"
            - name: Stop only this qualification's containers
              if: always()
              run: |
                  docker ps -aq --filter "label=ipat.pr.output=$IPAT_PR_OUTPUT" | xargs -r docker rm -f
            - name: Preserve native distributed qualification evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: kimi-pr-projection-${{ github.run_id }}
                  path: ${{ env.IPAT_PR_OUTPUT }}/**
                  retention-days: 30
                  if-no-files-found: error
    pr-model:
        if: ${{ (inputs.generate-cli-command == 'PR67372 model screen' || inputs.generate-cli-command == 'PR67373 model screen') }}
        name: DSpark exact-runtime natural model screen
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
        timeout-minutes: 100
        permissions:
            contents: read
        concurrency:
            group: sa-mi355x-single-node
            cancel-in-progress: false
        env:
            IPAT_PR_DATA_ROOT: /share_nfs/gguasti/benchmarks
            IPAT_PR_MANIFEST: ${{ inputs.pr-runtime-manifest }}
            IPAT_PR_OUTPUT: /share_nfs/gguasti/benchmarks/pr-model-${{ github.run_id }}-${{ github.run_attempt }}
            PYTHONDONTWRITEBYTECODE: '1'
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: pr-${{ github.run_id }}
                  persist-credentials: false
            - name: Verify images and native distributed model
              working-directory: pr-${{ github.run_id }}
              run: |
                  set -eo pipefail
                  mkdir -p "$IPAT_PR_OUTPUT"
                  bash benchmarks/pr_runtime/model_check.sh 2>&1 | tee "$IPAT_PR_OUTPUT/workflow.log"
            - name: Stop only this qualification's containers
              if: always()
              run: |
                  docker ps -aq --filter "label=ipat.pr.output=$IPAT_PR_OUTPUT" | xargs -r docker rm -f
            - name: Preserve native distributed qualification evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: kimi-pr-model-${{ github.run_id }}
                  path: |
                      ${{ env.IPAT_PR_OUTPUT }}/**
                      !${{ env.IPAT_PR_OUTPUT }}/**/cache/**
                  retention-days: 30
                  if-no-files-found: error
    pr-mxfp4:
        if: ${{ (inputs.generate-cli-command == 'PR67372 MXFP4 kernel check' || inputs.generate-cli-command == 'PR67373 MXFP4 kernel check') }}
        name: Kimi MXFP4 native kernel and graph qualification
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
