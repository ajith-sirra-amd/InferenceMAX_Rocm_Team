        if: ${{ startsWith(inputs.generate-cli-command, 'Fixed-length Kimi ') }}
        name: Kimi C48 fixed-length 8192-1024
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
        timeout-minutes: 100
        permissions:
            contents: read
        concurrency:
            group: sa-mi355x-single-node
            cancel-in-progress: false
        env:
            FIXED_OUTPUT: /share_nfs/ajith/benchmarks/fixed-${{ github.run_id }}-${{ github.run_attempt }}
            PYTHONDONTWRITEBYTECODE: '1'
            FIXED_OPTIMIZATION: ${{ inputs.generate-cli-command == 'Fixed-length Kimi AttnRes' && 'attnres' || inputs.generate-cli-command == 'Fixed-length Kimi DSpark' && 'dspark' || inputs.generate-cli-command == 'Fixed-length Kimi MoE front' && 'moe_front' || inputs.generate-cli-command == 'Fixed-length Kimi MoE front + DSpark' && 'moe_front_dspark' || 'baseline' }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: fixed-${{ github.run_id }}
                  persist-credentials: false
            - name: Pinned SA server and fixed 8192-1024 client
              working-directory: fixed-${{ github.run_id }}
              run: |
                  mkdir -p "$FIXED_OUTPUT"
                  set -o pipefail
                  bash benchmarks/fixed_length/kimi_k31_c48.sh "$FIXED_OUTPUT" "$FIXED_OPTIMIZATION" 2>&1 | tee "$FIXED_OUTPUT/workflow.log"
            - name: Stop only this benchmark container
              if: always()
              run: |
                  docker stop --time 120 "kimi-fixed-fixed-${{ github.run_id }}-${{ github.run_attempt }}" || true
                  docker rm -f "kimi-fixed-fixed-${{ github.run_id }}-${{ github.run_attempt }}" || true
            - name: Save fixed-length results and logs
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: kimi-fixed-${{ github.run_id }}
                  path: |
                      ${{ env.FIXED_OUTPUT }}/*.json
                      ${{ env.FIXED_OUTPUT }}/*.txt
                      ${{ env.FIXED_OUTPUT }}/*.log
                  retention-days: 30
                  if-no-files-found: error
    natural-validation:
        if: ${{ inputs.generate-cli-command == 'Natural validation Kimi baseline + MoE front + DSpark' }}
        name: Kimi C48 natural scored screen - baseline and combined
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
        timeout-minutes: 85
        permissions:
            contents: read
        concurrency:
            group: sa-mi355x-single-node
            cancel-in-progress: false
        env:
            NATURAL_OUTPUT: /share_nfs/ajith/benchmarks/natural-${{ github.run_id }}-${{ github.run_attempt }}
            RUN_STAMP: natural-${{ github.run_id }}-${{ github.run_attempt }}
            PYTHONDONTWRITEBYTECODE: '1'
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: natural-${{ github.run_id }}
                  persist-credentials: false
            - name: Sequential natural baseline and combined screen
              working-directory: natural-${{ github.run_id }}
              run: |
                  set -eo pipefail
                  mkdir -p "$NATURAL_OUTPUT"
                  for arm in baseline moe_front_dspark; do
                      arm_dir="$NATURAL_OUTPUT/$RUN_STAMP-$arm"
                      mkdir -p "$arm_dir"
                      timeout --signal=TERM --kill-after=120s 38m \
                          bash benchmarks/fixed_length/kimi_k31_c48.sh "$arm_dir" "$arm" natural \
                          2>&1 | tee "$arm_dir/workflow.log"
                  done
                  python3 benchmarks/quality/compare.py \
                      "$NATURAL_OUTPUT/$RUN_STAMP-baseline" \
                      "$NATURAL_OUTPUT/$RUN_STAMP-moe_front_dspark" \
                      "$NATURAL_OUTPUT/comparison.json"
            - name: Stop only this natural-validation job's containers
              if: always()
              run: |
                  for arm in baseline moe_front_dspark; do
                      container="kimi-natural-$RUN_STAMP-$arm"
                      timeout 50s docker stop --time 45 "$container" || true
                      timeout 10s docker rm -f "$container" "$container-install" "$container-ownership" || true
                  done
            - name: Save natural-screen evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: kimi-natural-${{ github.run_id }}
                  path: |
                      ${{ env.NATURAL_OUTPUT }}/**
                      !${{ env.NATURAL_OUTPUT }}/**/work/**
                  retention-days: 30
                  if-no-files-found: error
    agentic-comparison:
        if: ${{ inputs.generate-cli-command == 'Agentic Kimi baseline + MoE front + DSpark' }}
        name: Kimi C48 native SA agentic - baseline then combined
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
        timeout-minutes: 380
        permissions:
            contents: read
        concurrency:
            group: sa-mi355x-single-node
            cancel-in-progress: false
        env:
            AGENTIC_OUTPUT: /share_nfs/ajith/benchmarks/agentic-${{ github.run_id }}-${{ github.run_attempt }}
            RUN_STAMP: agentic-${{ github.run_id }}-${{ github.run_attempt }}
            PYTHONDONTWRITEBYTECODE: '1'
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: agentic-${{ github.run_id }}
                  persist-credentials: false
            - name: Check out the measured SA client
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  repository: SemiAnalysisAI/InferenceX
                  ref: 903a3023682c6b27683839309cbd4b4d9153afcb
                  path: sa-client-${{ github.run_id }}
                  sparse-checkout: |
                      inferencex-e2e/infx
                      inferencex-e2e/benchmarks
                  persist-credentials: false
            - name: Prepare and validate pinned client without GPUs
              timeout-minutes: 45
              working-directory: agentic-${{ github.run_id }}
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: |
                  set -eo pipefail
                  mkdir -p "$AGENTIC_OUTPUT"
                  bash benchmarks/agentic/prepare.sh "$AGENTIC_OUTPUT/client" \
                      "$(realpath "../sa-client-$GITHUB_RUN_ID/inferencex-e2e")" \
                      2>&1 | tee "$AGENTIC_OUTPUT/prepare.log"
            - name: Baseline - native SA warmup and 3600-second measurement
              timeout-minutes: 165
              working-directory: agentic-${{ github.run_id }}
              run: |
                  set -eo pipefail
                  arm_dir="$AGENTIC_OUTPUT/$RUN_STAMP-baseline"
                  mkdir -p "$arm_dir"
                  timeout --signal=TERM --kill-after=120s 160m \
                      bash benchmarks/fixed_length/kimi_k31_c48.sh "$arm_dir" baseline agentic \
                      "$AGENTIC_OUTPUT/client" "$(realpath "../sa-client-$GITHUB_RUN_ID/inferencex-e2e")" \
                      2>&1 | tee "$arm_dir/workflow.log"
            - name: Preserve baseline before the candidate
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: kimi-agentic-baseline-${{ github.run_id }}
                  path: |
                      ${{ env.AGENTIC_OUTPUT }}/${{ env.RUN_STAMP }}-baseline/**
                      !${{ env.AGENTIC_OUTPUT }}/${{ env.RUN_STAMP }}-baseline/work/**
                  retention-days: 30
                  if-no-files-found: warn
            - name: Combined - native SA warmup and 3600-second measurement
              timeout-minutes: 165
              working-directory: agentic-${{ github.run_id }}
              run: |
                  set -eo pipefail
                  arm_dir="$AGENTIC_OUTPUT/$RUN_STAMP-moe_front_dspark"
                  mkdir -p "$arm_dir"
                  timeout --signal=TERM --kill-after=120s 160m \
                      bash benchmarks/fixed_length/kimi_k31_c48.sh "$arm_dir" moe_front_dspark agentic \
                      "$AGENTIC_OUTPUT/client" "$(realpath "../sa-client-$GITHUB_RUN_ID/inferencex-e2e")" \
                      2>&1 | tee "$arm_dir/workflow.log"
            - name: Stop only this agentic job's containers
              if: always()
              run: |
                  timeout 15s docker stop --time 10 "sa-agentic-prepare-$RUN_STAMP" || true
                  timeout 10s docker rm -f "sa-agentic-prepare-$RUN_STAMP" || true
                  for arm in baseline moe_front_dspark; do
                      container="kimi-agentic-$RUN_STAMP-$arm"
                      timeout 50s docker stop --time 45 "$container" || true
                      timeout 10s docker rm -f "$container" "$container-install" "$container-ownership" || true
                  done
            - name: Preserve agentic results and preparation evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: kimi-agentic-${{ github.run_id }}
                  path: |
                      ${{ env.AGENTIC_OUTPUT }}/**
                      !${{ env.AGENTIC_OUTPUT }}/**/work/**
                      !${{ env.AGENTIC_OUTPUT }}/client/runtime/**
                      !${{ env.AGENTIC_OUTPUT }}/client/cache/**
                      !${{ env.AGENTIC_OUTPUT }}/client/home/**
                      !${{ env.AGENTIC_OUTPUT }}/client/tmp/**
                  retention-days: 30
                  if-no-files-found: error
    natural-verifier-diagnostic:
        if: ${{ startsWith(inputs.generate-cli-command, 'Natural verifier diagnostic ') }}
        name: Kimi native verifier diagnostic - C1 and short C48
        runs-on: [self-hosted, 'cluster:mi355x-amds-2']
        timeout-minutes: 170
        permissions:
            contents: read
        concurrency:
            group: sa-mi355x-single-node
            cancel-in-progress: false
        env:
            DIAGNOSTIC_OUTPUT: /share_nfs/ajith/benchmarks/natural-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
            RUN_STAMP: natural-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
            DIAGNOSTIC_MODE: ${{ inputs.generate-cli-command }}
            PYTHONDONTWRITEBYTECODE: '1'
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.sha }}
                  path: natural-diagnostic-${{ github.run_id }}
                  persist-credentials: false
            - name: Wait for idle GPUs - check every five minutes
              if: ${{ inputs.generate-cli-command == 'Natural verifier diagnostic Wait for idle GPUs' }}
              timeout-minutes: 122
              working-directory: natural-diagnostic-${{ github.run_id }}
              run: python3 benchmarks/quality/diagnostic/wait_for_idle.py "$DIAGNOSTIC_OUTPUT.availability.jsonl"
            - name: Observe short natural verification and graph proposals
              timeout-minutes: 43
              working-directory: natural-diagnostic-${{ github.run_id }}
              run: |
                  set -eo pipefail
                  mkdir -p "$(dirname "$DIAGNOSTIC_OUTPUT")"
                  if [[ "$DIAGNOSTIC_MODE" == 'Natural verifier diagnostic GPU ownership' ]]; then
                      timeout 180s python3 benchmarks/quality/diagnostic/inspect_gpu.py "$DIAGNOSTIC_OUTPUT" \
                          2>&1 | tee "$DIAGNOSTIC_OUTPUT.log"
                  else
                      bash benchmarks/quality/diagnostic/run.sh "$PWD" "$DIAGNOSTIC_OUTPUT" \
                          2>&1 | tee "$DIAGNOSTIC_OUTPUT.log"
                  fi
            - name: Stop only this diagnostic job's containers
              if: always()
              run: |
                  container="kimi-diagnostic-$RUN_STAMP"
                  timeout 50s docker stop --time 45 "$container" || true
                  timeout 10s docker rm -f "$container" "$container-ownership" || true
            - name: Preserve diagnostic evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: kimi-natural-diagnostic-${{ github.run_id }}
                  path: |
                      ${{ env.DIAGNOSTIC_OUTPUT }}.log
                      ${{ env.DIAGNOSTIC_OUTPUT }}.availability.jsonl
                      ${{ env.DIAGNOSTIC_OUTPUT }}/**
                      !${{ env.DIAGNOSTIC_OUTPUT }}/work/**
                  retention-days: 30
                  if-no-files-found: error
    get-jobs:
        if: ${{ !startsWith(inputs.generate-cli-command, 'Fixed-length Kimi ') && !startsWith(inputs.generate-cli-command, 'Natural validation Kimi ') && !startsWith(inputs.generate-cli-command, 'Agentic Kimi ') && !startsWith(inputs.generate-cli-command, 'Natural verifier diagnostic ') && !startsWith(inputs.generate-cli-command, 'PR67372 ') && !startsWith(inputs.generate-cli-command, 'PR67373 ') }}
        runs-on: ubuntu-latest
        outputs:
            single-node-config: ${{ steps.get-jobs.outputs.single-node-config }}
            multi-node-config: ${{ steps.get-jobs.outputs.multi-node-config }}
            eval-config: ${{ steps.get-jobs.outputs.eval-config }}
            multi-node-eval-config: ${{ steps.get-jobs.outputs.multi-node-eval-config }}
            agentic-config: ${{ steps.get-jobs.outputs.agentic-config }}
            multi-node-agentic-config: ${{ steps.get-jobs.outputs.multi-node-agentic-config }}
        steps:
            - name: Checkout code (ref)
              if: ${{ inputs.ref && inputs.ref != '' }}
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                ref: ${{ inputs.ref }}

            - name: Checkout code (default)
              if: ${{ !inputs.ref || inputs.ref == '' }}
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                ref: ${{ github.sha }}

            - id: get-jobs
              run: |
                  pip install pydantic
                  CONFIG_JSON=$(python3 ${GITHUB_WORKSPACE}/utils/matrix_logic/generate_sweep_configs.py \
                    ${{ inputs.generate-cli-command || github.event.inputs.generate-cli-command }})
                  AGENTIC=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if x.get('scenario-type') == 'agentic-coding' and 'prefill' not in x]))")
                  MULTI_AGENTIC=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if x.get('scenario-type') == 'agentic-coding' and 'prefill' in x]))")
                  SINGLE=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' not in x and x.get('scenario-type') != 'agentic-coding' and not x.get('eval-only', False)]))")
                  MULTI=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' in x and x.get('scenario-type') != 'agentic-coding' and not x.get('eval-only', False)]))")
                  EVALS=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' not in x and x.get('scenario-type') != 'agentic-coding' and x.get('run-eval', False)]))")
                  MULTI_EVAL=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([x for x in d if 'prefill' in x and x.get('run-eval', False)]))")
                  echo "agentic-config=$AGENTIC" >> $GITHUB_OUTPUT
                  echo "multi-node-agentic-config=$MULTI_AGENTIC" >> $GITHUB_OUTPUT
                  echo "single-node-config=$SINGLE" >> $GITHUB_OUTPUT
                  echo "multi-node-config=$MULTI" >> $GITHUB_OUTPUT
                  echo "eval-config=$EVALS" >> $GITHUB_OUTPUT
                  echo "multi-node-eval-config=$MULTI_EVAL" >> $GITHUB_OUTPUT

    test-sweep-multi-node:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-config != '[]' }}
        uses: ./.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.multi-node-config) }}
        secrets: inherit
        with:
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            exp-name: ${{ matrix.config.exp-name }}
            conc-list: ${{ toJson(matrix.config.conc) }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}

            prefill-num-worker: ${{ matrix.config.prefill.num-worker }}
            prefill-tp: ${{ matrix.config.prefill.tp }}
            prefill-ep: ${{ matrix.config.prefill.ep }}
            prefill-dp-attn: ${{ matrix.config.prefill.dp-attn }}
            prefill-additional-settings: ${{ toJson(matrix.config.prefill.additional-settings) }}

            decode-num-worker: ${{ matrix.config.decode.num-worker }}
            decode-tp: ${{ matrix.config.decode.tp }}
            decode-ep: ${{ matrix.config.decode.ep }}
            decode-dp-attn: ${{ matrix.config.decode.dp-attn }}
            decode-additional-settings: ${{ toJson(matrix.config.decode.additional-settings) }}
            run-eval: false
            ref: ${{ inputs.ref }}

    test-sweep-multi-node-evals:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-eval-config != '[]' }}
        uses: ./.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node eval /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.multi-node-eval-config) }}
        secrets: inherit
        with:
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            exp-name: ${{ matrix.config.exp-name }}
            conc-list: ${{ toJson(matrix.config.conc) }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}

            prefill-num-worker: ${{ matrix.config.prefill.num-worker }}
            prefill-tp: ${{ matrix.config.prefill.tp }}
            prefill-ep: ${{ matrix.config.prefill.ep }}
            prefill-dp-attn: ${{ matrix.config.prefill.dp-attn }}
            prefill-additional-settings: ${{ toJson(matrix.config.prefill.additional-settings) }}

            decode-num-worker: ${{ matrix.config.decode.num-worker }}
            decode-tp: ${{ matrix.config.decode.tp }}
            decode-ep: ${{ matrix.config.decode.ep }}
            decode-dp-attn: ${{ matrix.config.decode.dp-attn }}
            decode-additional-settings: ${{ toJson(matrix.config.decode.additional-settings) }}
            run-eval: true
            eval-only: true
            eval-conc: ${{ matrix.config.eval-conc }}
            ref: ${{ inputs.ref }}

    test-sweep-agentic:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.agentic-config != '[]' }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: agentic /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.agentic-config) }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            tp: ${{ matrix.config.tp }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            offloading: ${{ matrix.config.offloading }}
            kv-offloading: ${{ matrix.config['kv-offloading'] }}
            kv-offload-backend: ${{ matrix.config['kv-offload-backend'].name }}
            total-cpu-dram-gb: ${{ matrix.config.total-cpu-dram-gb }}
            duration: ${{ inputs.duration-override != '' && inputs.duration-override || matrix.config.duration }}
            isl: '0'
            osl: '0'
            max-model-len: '0'
            spec-decoding: ${{ matrix.config['spec-decoding'] }}
            disagg: 'false'
            run-eval: false
            scenario-type: agentic-coding
            ref: ${{ inputs.ref }}

    test-sweep-multi-node-agentic:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.multi-node-agentic-config != '[]' }}
        uses: ./.github/workflows/benchmark-multinode-tmpl.yml
        name: multi-node agentic /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.multi-node-agentic-config) }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            isl: '0'
            osl: '0'
            max-model-len: '0'
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            conc-list: '[${{ matrix.config.conc }}]'
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            prefill-num-worker: ${{ matrix.config.prefill.num-worker }}
            prefill-tp: ${{ matrix.config.prefill.tp }}
            prefill-ep: ${{ matrix.config.prefill.ep }}
            prefill-dp-attn: ${{ matrix.config.prefill.dp-attn }}
            prefill-additional-settings: ${{ toJson(matrix.config.prefill.additional-settings) }}
            decode-num-worker: ${{ matrix.config.decode.num-worker }}
            decode-tp: ${{ matrix.config.decode.tp }}
            decode-ep: ${{ matrix.config.decode.ep }}
            decode-dp-attn: ${{ matrix.config.decode.dp-attn }}
            decode-additional-settings: ${{ toJson(matrix.config.decode.additional-settings) }}
            conc: ${{ matrix.config.conc }}
            duration: ${{ inputs.duration-override != '' && inputs.duration-override || matrix.config.duration }}
            run-eval: false
            scenario-type: agentic-coding
            ref: ${{ inputs.ref }}

    test-sweep-single-node:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.single-node-config != '[]' }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: single-node /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.single-node-config) }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            tp: ${{ matrix.config.tp }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            run-eval: false
            ref: ${{ inputs.ref }}

    test-sweep-evals:
        needs: get-jobs
        if: ${{ needs.get-jobs.outputs.eval-config != '[]' }}
        uses: ./.github/workflows/benchmark-tmpl.yml
        name: eval /
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJson(needs.get-jobs.outputs.eval-config) }}
        secrets: inherit
        with:
            exp-name: ${{ matrix.config.exp-name }}
            isl: ${{ matrix.config.isl }}
            osl: ${{ matrix.config.osl }}
            max-model-len: ${{ matrix.config.max-model-len }}
            runner: ${{ matrix.config.runner }}
            image: ${{ matrix.config.image }}
            model: ${{ matrix.config.model }}
            model-prefix: ${{ matrix.config.model-prefix }}
            framework: ${{ matrix.config.framework }}
            precision: ${{ matrix.config.precision }}
            tp: ${{ matrix.config.tp }}
            ep: ${{ matrix.config.ep }}
            dp-attn: ${{ matrix.config.dp-attn }}
            conc: ${{ matrix.config.conc }}
            spec-decoding: ${{ matrix.config.spec-decoding }}
            disagg: ${{ matrix.config.disagg }}
            run-eval: true
            eval-only: true
            ref: ${{ inputs.ref }}

    collect-results:
        needs: [test-sweep-multi-node, test-sweep-single-node, test-sweep-agentic, test-sweep-multi-node-agentic]
        if: ${{ always() && (needs.test-sweep-multi-node.result != 'skipped' || needs.test-sweep-single-node.result != 'skipped' || needs.test-sweep-agentic.result != 'skipped' || needs.test-sweep-multi-node-agentic.result != 'skipped') }}
        uses: ./.github/workflows/collect-results.yml
        secrets: inherit
        with:
            result-prefix: "bmk"

    collect-evals:
        needs: [test-sweep-evals, test-sweep-multi-node-evals]
        if: ${{ always() && (needs.test-sweep-evals.result != 'skipped' || needs.test-sweep-multi-node-evals.result != 'skipped') }}
        uses: ./.github/workflows/collect-evals.yml
        secrets: inherit

    collect-agentic-results:
        needs: [test-sweep-agentic, test-sweep-multi-node-agentic]
        if: ${{ always() && (needs.test-sweep-agentic.result != 'skipped' || needs.test-sweep-multi-node-agentic.result != 'skipped') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  token: ${{ secrets.REPO_PAT }}
                  submodules: true

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: pip install pandas matplotlib numpy

            - name: Download agentic artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: 'agentic_*'
                  path: results/

            - name: Run aggregation
              env:
                  PYTHONPATH: ${GITHUB_WORKSPACE}/upstream/InferenceX/utils/agentic-benchmark/scripts:${GITHUB_WORKSPACE}/upstream/InferenceX/utils/agentic-benchmark/analysis
              run: |
                  python ${GITHUB_WORKSPACE}/upstream/InferenceX/utils/agentic-benchmark/scripts/collect_sweep_results.py results/ aggregated/

            - name: Upload aggregated results
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: agentic_aggregated
                  path: aggregated/
            
            - name: Cleanup
              run: |
                  rm -rf results

