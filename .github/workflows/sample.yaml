name: Hello World Workflow
on: [push]

jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Run a one-line script
      run: echo "Hello, world!"
    - name: Run a multi-line script
      run: |
        echo "This is a multi-line script."
        echo "It can execute multiple commands."