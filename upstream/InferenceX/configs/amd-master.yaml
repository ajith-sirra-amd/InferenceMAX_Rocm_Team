# DSv4-Pro FP4 on MI355X via SGLang. Uses a rocm720 mi35x image built off the
# amd/deepseek_v4 branch in sgl-project/sglang; the SHA is encoded in the
# image tag, so bumping sglang is just an image tag bump here. Sweeps
# DP-attention on/off and EP=8.

dsr1-fp4-mi355x-sglang-disagg-mtp:
  image: lmsysorg/sglang-rocm:v0.5.12-rocm720-mi35x-20260519
  model: amd/DeepSeek-R1-0528-MXFP4-v2
  model-prefix: dsr1
  runner: mi355x-disagg
  precision: fp4
  framework: sglang-disagg
  router: { name: sglang-router, version: "0.3.2" }
  kv-p2p-transfer: mori
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # MTP configurations
      # 1P1D pure TP8
      - spec-decoding: "mtp"
        conc-list: [ 1, 2, 4, 8 ]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=3"

      # 1P2D TP8
      - spec-decoding: "mtp"
        conc-list: [ 2, 4, 8, 16, 32 ]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 2
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=2"
          - "DECODE_MTP_SIZE=3"

      # 1P2D TP8
      - spec-decoding: "mtp"
        conc-list: [ 64, 128, 256 ]
        prefill:
          num-worker: 1
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 2
          tp: 8
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=2"
          - "DECODE_MTP_SIZE=2"

      # 1*DEP8 + 1*DEP8
      - spec-decoding: "mtp"
        conc-list: [ 128, 512 ]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=1"

      # 1*DEP8 + 1*DEP8
      - spec-decoding: "mtp"
        conc-list: [ 64, 256 ]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=1"

      # 2*DEP8 + 1*DEP8
      - spec-decoding: "mtp"
        conc-list: [ 1024, 2048, 4096 ]
        prefill:
          num-worker: 2
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=2"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=1"

dsv4-fp4-mi355x-sglang-agentic-hicache:
  image: lmsysorg/sglang-rocm:v0.5.14-rocm720-mi35x-20260710
  model: deepseek-ai/DeepSeek-V4-Pro
