kimik3-fp4-mi355x-vllm-agentic-mtp:
  # DCP is UNPARKED. The old claim here -- that DCP "needs AMD kernel fixes" --
  # was wrong: aiter's mla_decode_fwd already takes return_lse/cp_world_size/
  # cp_rank/g_kv_indptr and gfx950 ships the CP round-robin kernels; only vLLM's
  # wrapper was missing. apply_kimi_k3_patches.sh patch [4] plumbs it through,
  # moving DCP decode from TRITON_MLA to ROCM_AITER_MLA and sidestepping the
  # HSA_STATUS_ERROR_EXCEPTION 0x1016 fault rather than fixing it.
  #
  # Nightly, not the unified image: DCP needs patch [4], and the LSE convention,
  # kernel selection and gathered-head merge were all measured on a nightly.
  # Bumped ac7509e2b (2026-08-14) -> 311b3513 (2026-08-17). ac7509e2b's bundled
  # aiter caps Gluon MLA at "nhead <= 16 or nhead in (64,128)", so the 96 heads a
  # TP8/DCP8 gather produces have no Gluon kernel there -- ROCm/aiter#4412
  # ("support nhead=96 for MLA", merged 2026-07-29) was not picked up despite the
  # image post-dating it. That is why this recipe drives the ASM cprr path rather
  # than Gluon. Whether 311b3513 ships a newer aiter is exactly what this run
  # answers; the ASM path does not depend on it either way.
  # T14: colleague image, which ships PR #51705 pre-applied AND -- per their
  # note -- a DSpark draft verify under DCP that works on BOTH the ASM and Gluon
  # backends. That implies an aiter newer than v0.1.19, the version pinned by
  # both nightlies, whose mla_gluon asserts "nhead <= 16 or nhead in (64,128)"
  # and therefore has no kernel for the 96 heads a TP8/DCP8 gather produces.
  # This is the only way to test MTP under DCP: the ASM path has no gqa=64
  # kernel past qseqlen 1, so qlen>1 verify has been unreachable on our images.
  # Their caveats: ASM must slice 96->12 then pad to 16 and cannot multi-token
  # verify (token-by-token at qlen=1 only); Gluon does qh96 natively but must
  # flatten instead of using native 4-D MTP.
  # T16: back to the nightly. The colleague image is a dead end for a CONCURRENT
  # benchmark: its newer aiter (post-#4412) makes DCP decode route to Gluon, and
  # the mla_gluon[bh16bn128] regime requires batch_size=1 --
  #   T14 spec ON : "requires batch_size=1, got 64"
  #   T15 spec OFF: "requires batch_size=1, got 3"
  # so it fails at any concurrency > 1, which is why PR #52248 benchmarked at
  # --max-num-seqs 8. Our nightly pins aiter v0.1.19, which has NO Gluon qh96,
  # so DCP falls back to the ASM path -- and that path does work at concurrency.
  # Matched to the reference run's image so DCP is the only variable. The 5,388
  # reference was measured on THIS nightly -- not the unified image, which kills
  # the "unified has tuned GEMMs" theory I had been carrying.
  # T58 bisect: the reference's image. T22 got TPOT 0.043 on code point 3fa1b88a
  # and the SA reference 0.038 on ac7509e2b, while T47/T57 get 0.118 on 5a4c8d99
  # -- a 2.7x decode regression with spec OFF and DCP OFF on every arm.
  # BEST MEASURED CONFIG: T58 (32414712217) -- 2,685.0 tok/s/GPU, TPOT 0.1161,
  # TTFT 3.450 s, non-DCP, spec off, real tokens, patches [1][2][3] only.
  # Slightly ahead of the same config on 5a4c8d99 (T47: 2,655.7 / 0.1176).
  #
  # DCP+MTP -- the reference's recipe, and the only untried combination that could
  # have closed the gap -- is refused at init on every ROCm MLA backend: T60 showed
  # _validate_dspark_dcp_support requires supports_non_causal_multi_token_dcp
  # (declared only by tokenspeed_mla, absent from ROCm) or supports_dcp_with_varlen
  # (declared only by flashinfer/flashattn/flashmla, all NVIDIA).
  # T66c: DCP must run on 5a4c8d99. The DCP patch stack ([5] PR#51705, [6], [8])
  # was developed against it; on ac7509e2b the builder predates PR #51705's
  # plumbing and T66b died with
  #   'AiterMLAMetadataBuilder' object has no attribute 'dcp_world_size'
  # Image caveat, stated rather than hidden: on the NON-DCP arm these two images
  # differ by 1.1% (T47 2,655.7 on 5a4c8d99 vs T58 2,685.0 on ac7509e2b, both
  # forced TRITON_MLA), so comparing DCP-on-5a4c8d99 against T64-on-ac7509e2b
  # carries ~1% image uncertainty -- an order of magnitude below the effect.
  # aigmkt/ prefix is required: the runner pulls rather than using a local
  # image, so the bare tag kimi-k3-vllm:no-rejects fails with "pull access
  # denied" -- it is built on the box and was never pushed. This is also the
  # image T103 and T133 ran, so the sweep stays comparable to them.
  # T147: STOCK nightly, 175 commits ahead of the f94666b60d our image is built
  # on. Not a rebuild -- the launcher applies the one line this needs at runtime
  # (patch_triton_mla_cudagraph_runtime), so no image build and no registry push.
  #
  # That one line is all a C1 run needs out of the vendored #51705 diff: the rest
  # is DCP, and T144 vs T145 measured DCP=8 at C1 as +36.5% TPOT. #52707 merged
  # upstream 2026-08-28 and IS in this nightly; #51705 is still open, and C1 does
  # not want it.
  #
  # What this is testing, in expected order of effect at C1:
  #   #53942 eh_proj low-latency GEMM -- "enabling m=1 and m=2", exactly the C1
  #          batch regime, 12.9-25.2% kernel improvement. eh_proj is the MTP
  #          projection and sat on nn.Linear, so the low-latency dispatch never
  #          applied to it.
  #   #53818 ROCm: capture CUDA graphs on the current stream -- graphs were being
  #          recorded on a stream that never ran warmup.
  #   #53641 gpu_sync_allowed on the ROCm AITER FA backend (our MLA prefill).
  #   #53955 / #53682 release cudagraph profiling memory before KV allocation.
  #   #51040 ROCm K3 FP8 asm MLA prefill (merged; previously archived here).
  #
  # Revert to aigmkt/kimi-k3-vllm:latest if this regresses. That image remains
  # the reference for C52, which still needs #51705 for DCP.
  image: vllm/vllm-openai-rocm:nightly-46638857fdbb30e0c232c9e8f9cb1ff6d6f545c3
  # T117: AMD's Quark checkpoint. Same vLLM, same tokenizer/remote-code file set
  # as moonshotai/Kimi-K3, but quant_method=quark (not compressed-tensors) and
  # self_attn q/k/v/o + MLA q_a/q_b/kv_a/kv_b are F8_E4M3 with F32 per-channel
  # scales instead of BF16. Routed experts stay MXFP4 (U8 + e8m0), and shared
  # experts / dense MLP move BF16 -> MXFP4 as a bonus. kv_cache_quant_config is
  # empty, so the KV cache is untouched and the DCP + AITER-MLA path is unaffected.
  # 1.370 TiB vs 1.5 TB, so it also frees a little KV headroom.
  #
  # T117 OOM'd at shard 11/12 with 272 MB free, and the cause was NOT size:
  # per-GPU weights are 188.2 GB here vs 195.1 GB for moonshotai. AMD's config
  # declares MoE *activations* as fp4/group32/e8m0, so OCP_MX_Scheme resolved to
  # w_mxfp4_a_mxfp4 and vLLM selected AITER_MXFP4_MXFP4 -- annotated upstream as
  # "W4A4: CK kernel", a different kernel family from the AITER_MXFP4_BF16 +
  # VLLM_ROCM_USE_AITER_MOE_SITUV2_A8W4=1 path every working run has used. That
  # path wanted ~115 GB/GPU of extra transient memory during load.
  #
  # Fix, applied to the downloaded checkpoint (NOT to this repo), with the
  # original kept alongside as config.json.amd-orig:
  #     quantization_config.global_quant_config.input_tensors = null
  # from_quant_dtype(None, "mxfp4") -> w_mxfp4 -> AITER_MXFP4_BF16, i.e. exactly
  # T103's MoE kernels. Legitimate rather than a hack: MXFP4 activation quant is
  # is_dynamic=true, computed at runtime, so nothing stored in the weights is
  # invalidated -- the MXFP4 weights are bit-identical. layer_quant_config
  # "*self_attn*" carries its own fp8_e4m3 input_tensors, so FP8 attention (the
  # entire point of the run) is untouched. Activations end up higher precision
  # than AMD validated, so GSM8K should be >= their reported 96.36%.
  # Side benefit: MoE kernels now match T103 exactly, making this a true
  # single-variable test of BF16 -> FP8 attention weights.
  #
  # T119 VERDICT: AttnFP8 is a NET LOSS in this stack, and not for a reason the
  # checkpoint can be blamed for. With LOAD_FORMAT=auto it loads and serves
  # correctly on AITER_MXFP4_BF16, but:
  #     Model loading took        240.75 GiB   (moonshotai: 192.56 GiB)
  #     Available KV cache memory   9.38 GiB   (moonshotai:  54.41 GiB)
  #     GPU KV cache            5,391,048 tok  (moonshotai: ~32.7M tok)
  # It occupies +48 GiB/GPU MORE than moonshotai despite being 7 GB/GPU SMALLER
  # on disk (188.2 vs 195.1 GB/GPU) -- something upcasts or duplicates at load,
  # and it is not MoE tile padding (the ROCm branch of
  # mxfp4_round_up_hidden_size_and_intermediate_size explicitly notes K3's AITER
  # A16W4 SiTU kernel takes K3's native intermediate size).
  # The 6x smaller KV cache collapsed the run: "Running: 1 reqs, Waiting: 18",
  # prefix cache hit 0.0% against T103's 93.8%. Cancelled rather than spend GPU
  # hours measuring KV starvation.
  # Cost/benefit is decisive: T116's profile puts the entire BF16 dense-GEMM
  # block this checkpoint converts at 15.26% of GPU busy, worth +3-5% of wall,
  # against losing a 93.8% prefix cache hit rate. Not worth pursuing until the
  # +48 GiB is understood.
  model: moonshotai/Kimi-K3
  model-prefix: kimik3
  runner: cluster:mi355x-amds
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    agentic-coding:
    # 0.50 -> 0.65 buys CPU-offload headroom for the higher concurrencies below.
    # 0.80 was tried previously and OOM'd the host; 0.65 is the known-safe ceiling.
    - dram-utilization: 0.65
      search-space:
      # - { tp: 8, kv-offloading: none, conc-list: [1, 4, 8] , spec-decoding: mtp}
      # Straddles DCP_AUTO_CONC_THRESHOLD=64 in the launcher, so this one list
      # measures both regimes and gives a clean A/B across the threshold:
      #   c40      -> no DCP, MTP on   (extends the 4431/4749/5022 curve, which
      #                                 was still climbing at c20)
      #   c64, c72 -> DCP=8, spec off  (the patch [4] path; c72 is the closest
      #                                 comparison to B300's c70 + DCP=8)
      # KV budget without DCP: ~49.57 GiB/rank on this nightly, ~22 resident
      # requests at ~132k mean ISL -- which is the wall DCP is meant to remove.
      # NOTE c64/c72 give up spec decoding: aiter has no gqa=64 CP kernel past
      # qseqlen 1, so the DCP path keeps DISABLE_SPEC=1. Judge DCP on
      # tok/s/GPU, not on acceptance rate.
      # Single DCP arm. c64 is the lowest concurrency that crosses
      # DCP_AUTO_CONC_THRESHOLD, and it is the exact config brought up locally
      # on 8x MI355X (kernel selected, 17,014,182 KV tokens, 1318/1319 requests
      # served), so it is the arm most likely to actually return a number.
      # c72 -- the closer comparison to B300's c70 + DCP=8 -- and the c40
      # non-DCP control are follow-up runs, not this one.
      # c64 crosses DCP_AUTO_CONC_THRESHOLD, turning DCP on -- required, since
      # testing MTP-under-DCP is the whole point of this image.
      # T17: KV OFFLOADING TO DRAM -- the lever every one of trials 1-16 missed.
      # The 5,388 tok/s/GPU reference (SemiAnalysisAI/InferenceX run 31993981851)
      # runs kv-offloading: dram + vllm-simple at conc 20 on the NIGHTLY image,
      # and gets TTFT 12.2 s / 1,440 requests. Our trials all ran
      # kv-offloading: none and got TTFT 396 s / 226 requests with KV 82.9% full.
      # conc 20 matches the reference exactly so DCP is the only variable.
      # T19: scale concurrency. T18 (DCP=8 + dram, conc 20) hit 1,990.8
      # tok/s/GPU with TTFT 4.6 s -- better first-token latency than the 5,388
      # reference's 12.2 s -- while using a fraction of DCP's 31.22x KV. TTFT
      # that low means we are nowhere near saturated, and this is the regime the
      # reference physically cannot enter: it is capped at 2.52x KV and was
      # already 82.9% full at conc 32 in our own T12.
      # Back to c20. T19 at c64 was much WORSE than T18 at c20:
      #   1,041 vs 1,990 tok/s/GPU | TPOT 0.683 vs 0.174 | TTFT 501 vs 4.6 s
      #   119 invalid vs 38 | prefix cache hit collapsed 87% -> 14.9%
      # More concurrency blows out the cache working set (kv_usage was only 28%,
      # so it is reuse we run out of, not space). c20 is the operating point.
      # T27: back to c20 (T26 settled c8 at 969 tok/s/GPU, -52%). Sole variable
      # is VLLM_USE_DIRECT_DCP_{A2A,Q_GATHER,KV_GATHER} 0 -> 1 in the .sh.
      # T54: MTP at conc 8. T51 (32392005995) showed MTP + non-DCP is KV-STARVED
      # at conc 20: the drafter's weights and its own KV cut the pool from
      # 4,376,929 tokens (4.17x) to 1,385,293 (1.32x), and 20 concurrent requests
      # do not fit -- 16 queued behind 6 running, prefix hit collapsing 28.5% ->
      # 19.0%, tput_in_srv falling 9,538 -> 3,833/s monotonically. Cancelled.
      # The pool shrank ~3.2x, so the equivalent operating point is ~c6-8.
      # c8 also has a spec-off comparator on record (T26, DCP=4).
      # T55: EP=8, spec OFF, back to c20. MTP is closed (T51 collapsed at c20,
      # T54 completed at c8 with 541 tok/s/GPU vs T47's 2,656 -- the drafter cuts
      # the KV pool 4.17x -> 1.31x and this workload averages 137k input tokens
      # per request, so lowering concurrency does not help).
      # EP is the last untested parallelism axis that fits in 8 GPUs:
      # --enable-expert-parallel shards experts WITHOUT replicating attention, so
      # it stays at the TP8 footprint (195 GB/GPU) rather than DP attention's
      # impossible 295.2 GB. Never passed in 54 trials -- every row set ep: 1.
      # NOTE: spec-decoding also selects the SCRIPT FILENAME -- 'mtp' resolves to
      # kimik3_fp4_mi355x_mtp.sh (the one we maintain); 'none' resolves to
      # kimik3_fp4_mi355x.sh, which does not exist. T55 (32404418920) died on
      # exactly that. Keep it 'mtp' as the selector; actual speculation is gated
      # inside the script by DISABLE_SPEC, which is how T47/T48 ran spec-off.
      # T67: DP2/TP4/EP8 -- data-parallel attention. tp: 4 with DP_SIZE=2 in the
      # .sh gives 8 ranks; ep: 8 is REQUIRED or the experts do not shard and the
      # layout will not fit (the guard enforces this). ~209 GB/GPU of weights.
      # NOTE: spec-decoding was removed from the conc-52 line. It used to read
      # `spec-decoding: mtp`, which was inert because SPEC_ARGS was built empty
      # and the field was never consulted. Now that MTP is actually wired, that
      # stale field would have silently turned MTP on at conc 52, where it is
      # worth -85% (T102: 1,075.4 vs 7,206.4 at conc 40; prefix cache collapses
      # 53% -> 10% because the drafter's weights and KV shrink the pool).
      #
      # T121 -- minimum-TPOT interactivity point. Target is 3x below T106's
      # 22.4 ms. At CONC 1 nothing is compute-bound: a decode step issues ~118
      # global barriers and at batch 1 there is no work in flight to hide them,
      # so TPOT is barrier-latency-bound. Three changes, all pushing the same
      # direction:
      #   DCP 8 -> 1  : DCP buys KV pool, which is irrelevant at conc 1 (T106
      #                 held 95.5% prefix hit). It costs an a2a + KV gather +
      #                 merge on each of the 24 MLA layers, every step.
      #   MTP on      : amortises the whole step over ~2.51 accepted tokens.
      #                 This is the only lever large enough to reach 3x; DCP-off
      #                 alone cannot, because the 93 layers' 2 all-reduce each
      #                 remain. Harmless at conc 1 -- the KV-pool shrink that
      #                 killed MTP at conc 40 does not bind when one request runs.
      #   offload off : SA's c1 (kvnone) beat our T106 (dram) by 4.1% throughput
      #                 and 15.2% TTFT, and T116 shows copyBuffer firing 697,367
      #                 times with idle gaps bracketed by it. At conc 1 the KV
      #                 working set is tiny, so DRAM offload is pure stall risk.
      # mns 8 with a dense 1..24 ladder (8 x (k+1)); T106's mns 4 was too tight
      # and queued the replay's branched sub-requests, costing TTFT.
      # spec-decoding: mtp must stay on EVERY row. On this runner it is not an
      # env var the script can read -- launch_mi355x-amds.sh consumes it to build
      # SPEC_SUFFIX, and only benchmarks/single_node/agentic/kimik3_fp4_mi355x_mtp.sh
      # exists. Drop the field and SCRIPT_FALLBACK resolves to
      # kimik3_fp4_mi355x.sh, which is not in the tree, and the row fails before
      # the server starts. Whether MTP actually runs is decided in the script by
      # CONC (<=4 only), not by this field.
      # C52 -- no offload at mns 65. The only untested combination: mns 65 with no
      # offload completed in T124 and T128, while mns 80 with no offload has died
      # 3/3 with OUT_OF_RESOURCES. Targets SA's 8,296.0 without the crash.
      # T135 -- C1 ITL baseline on the fixed-length harness. The script now calls
      # run_benchmark_serving (ISL 8000 / OSL 2000) instead of the agentic replay,
      # so a cell is ~10 min rather than 1h12m. This row establishes the
      # same-harness baseline at k=8; the agentic 6.70 ms record was measured on
      # a different harness and is not comparable to it.
      # dcp-size 1: DCP buys KV pool, which is irrelevant at conc 1, and it costs
      # an a2a + KV gather + merge on each of the 24 MLA layers every step.
      # spec-decoding: mtp must stay -- the runner uses it to pick the _mtp script
      # filename. Whether MTP runs is decided in the script by CONC.
      # C1 row parked 2026-08-31: SA reproduction targets C52 only.
      # - { tp: 8, ep: 1, dcp-size: 1, kv-offloading: none, conc-list: [1], spec-decoding: mtp }
      # dram, not none. Three independent A/Bs favour the offload at C52:
      # T160 7,968 vs T161 7,824 (-1.8%), T103 vs T133 (-2.8%), SA 8,296 vs
      # 8,204 (-1.1%). The T116/T124 idle finding was real -- idle 44.3% ->
      # 28.2% -- but never converted to throughput, because dropping the
      # offload also drops the KV capacity that keeps the batch full.
      # Phase E, partial: C52's config space is exhausted (see EXPERIMENT-QUEUE
      # N1-N9), so the remaining question is whether 52 is even the best
      # operating point. We have 40 and 52 and nothing between or just above.
      # 48 and 56 bracket it; each conc is an independent measurement.
      - { tp: 8, ep: 1, dcp-size: 8, kv-offloading: dram, kv-offload-backend: { name: vllm-simple }, conc-list: [60], spec-decoding: mtp }
      # - { tp: 8, ep: 1, dcp-size: 8, kv-offloading: none, conc-list: [60], spec-decoding: mtp }

kimik3-fp4-mi355x-vllm-agentic-mtp-andy:
  image: aigmkt/k3-unified-v2-from-cb810:validation-20260815-opusfix1
  model: moonshotai/Kimi-K3
  model-prefix: kimik3
  runner: cluster:mi355x-amds
  precision: fp4
  framework: vllm
  multinode: false
  scenarios:
    agentic-coding:
    - dram-utilization: 0.30
      search-space:
      # - { tp: 8, kv-offloading: none, conc-list: [1, 4, 8] , spec-decoding: mtp}
      - { tp: 8, ep: 1, kv-offloading: none, conc-list: [1, 4], spec-decoding: mtp }
      - { tp: 8, ep: 1, kv-offloading: dram, kv-offload-backend: { name: vllm-simple }, conc-list: [8, 10, 12, 14, 16, 20], spec-decoding: mtp }
