  runner: cluster:mi325x-tw
  precision: fp8
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # 8k1k KV fits only ~20x concurrency (9472-token requests), so conc512 is
